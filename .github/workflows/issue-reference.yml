name: Issue reference

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  issue-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Pull Request issue reference
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$HEAD_REF" =~ ^feature/#([0-9]+)_[a-z0-9]+(_[a-z0-9]+)*$ ]]; then
            issue_number="${BASH_REMATCH[1]}"
          else
            echo "Cannot verify issue reference for invalid branch name: $HEAD_REF"
            exit 1
          fi

          if ! grep -Eq '^## Issue Number[[:space:]]*$' <<< "$PR_BODY"; then
            echo "Pull Request body must contain: ## Issue Number"
            exit 1
          fi

          if ! grep -Eq "^#${issue_number}[[:space:]]*$" <<< "$PR_BODY"; then
            echo "Issue Number must match the branch: #${issue_number}"
            exit 1
          fi
