name: Pull request title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  title-prefix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Pull Request title prefix
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          valid_prefix=false
          while IFS= read -r prefix; do
            if [[ "$PR_TITLE" == "[$prefix] "* ]]; then
              valid_prefix=true
              break
            fi
          done < <(sed -n 's/^  - //p' hack/prefix.yml)

          if [[ "$valid_prefix" != "true" ]]; then
            echo "Invalid Pull Request title: $PR_TITLE"
            echo "Use one of the prefixes defined in hack/prefix.yml."
            exit 1
          fi
