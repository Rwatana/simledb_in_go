<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 15: Reassign clean buffer</title><desc id="description">clean unpinned Bufferはtarget blockをtemporary Pageへreadした後だけassignmentを置き換える。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/><text class="title" x="700" y="60" text-anchor="middle">Chapter 4 / Feature 15: Reassign clean buffer</text>
  <rect class="box" x="45" y="180" width="280" height="190" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="185" y="225" text-anchor="middle">Current assignment</text><text class="text" x="185" y="280" text-anchor="middle">BlockID = old</text><text class="text" x="185" y="325" text-anchor="middle">Contents = old Page</text>
  <rect class="box" x="390" y="180" width="280" height="190" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="530" y="225" text-anchor="middle">Validate frame</text><text class="text" x="530" y="280" text-anchor="middle">assigned · clean</text><text class="text" x="530" y="325" text-anchor="middle">pin count 0</text>
  <rect class="box" x="735" y="180" width="280" height="190" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="875" y="225" text-anchor="middle">Read target block</text><text class="text" x="875" y="280" text-anchor="middle">into temporary Page</text><text class="text" x="875" y="325" text-anchor="middle">old state still visible</text>
  <rect class="box" x="1080" y="180" width="280" height="190" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="1220" y="225" text-anchor="middle">New assignment</text><text class="text" x="1220" y="280" text-anchor="middle">BlockID = target</text><text class="text" x="1220" y="325" text-anchor="middle">Contents = target Page</text>
  <line x1="325" y1="275" x2="390" y2="275" stroke="#475569" stroke-width="3"/><polygon points="390,275 377,267 377,283" fill="#475569"/><text class="text" x="357" y="255" text-anchor="middle">inspect</text>
  <line x1="670" y1="275" x2="735" y2="275" stroke="#475569" stroke-width="3"/><polygon points="735,275 722,267 722,283" fill="#475569"/><text class="text" x="702" y="255" text-anchor="middle">valid</text>
  <line x1="1015" y1="275" x2="1080" y2="275" stroke="#475569" stroke-width="3"/><polygon points="1080,275 1067,267 1067,283" fill="#475569"/><text class="text" x="1047" y="250" text-anchor="middle">commit</text>
  <rect class="box" x="260" y="475" width="880" height="105" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="700" y="517" text-anchor="middle">Invalid state or read error → return error</text><text class="text" x="700" y="555" text-anchor="middle">Old BlockID, Contents, dirty metadata, and pin count stay unchanged</text>
  <rect class="box" x="260" y="650" width="880" height="90" rx="12" fill="#e3f2fd" stroke="#6c8ebf"/><text class="heading" x="700" y="705" text-anchor="middle">Clean reassignment performs no flush; dirty replacement stays separate.</text>
</svg>
