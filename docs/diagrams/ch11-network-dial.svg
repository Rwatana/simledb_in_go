<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="680" viewBox="0 0 1250 680" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Context-aware network dial</title>
  <desc id="description">A network JDBC URL is parsed into a host and combined with default port 1099. A context-aware TCP dial returns a connection owned by the caller. No RPC handshake or database session is started.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1250" height="680" fill="#fff"/><text class="title" x="625" y="52" text-anchor="middle">Chapter 11 / Context-aware network dial</text>
  <rect class="box" x="40" y="145" width="250" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="165" y="180" text-anchor="middle">Data source name</text><text class="small" x="165" y="208" text-anchor="middle">jdbc:simpledb://db.example.org</text>
  <rect class="box" x="350" y="145" width="250" height="90" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="475" y="180" text-anchor="middle">ParseNetworkURL</text><text class="small" x="475" y="208" text-anchor="middle">validate and extract host</text>
  <rect class="box" x="660" y="145" width="250" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="785" y="180" text-anchor="middle">net.JoinHostPort</text><text class="small" x="785" y="208" text-anchor="middle">db.example.org:1099</text>
  <rect class="box" x="970" y="145" width="240" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text class="label" x="1090" y="180" text-anchor="middle">DialContext</text><text class="small" x="1090" y="208" text-anchor="middle">TCP plus caller context</text>
  <rect class="box" x="660" y="385" width="250" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="785" y="420" text-anchor="middle">net.Conn</text><text class="small" x="785" y="448" text-anchor="middle">caller closes it</text>
  <rect class="box" x="260" y="545" width="730" height="55" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="small" x="625" y="578" text-anchor="middle">URL and dial errors retain context; no RPC handshake or database session starts here.</text>
  <path class="line" d="M290 190 H350"/><path class="line" d="M600 190 H660"/><path class="line" d="M910 190 H970"/><path class="line" d="M1090 235 V330 H785 V385"/>
  <text class="small" x="320" y="175" text-anchor="middle">parse</text><text class="small" x="630" y="175" text-anchor="middle">host</text><text class="small" x="940" y="175" text-anchor="middle">dial</text><text class="small" x="930" y="315" text-anchor="middle">success</text>
</svg>
