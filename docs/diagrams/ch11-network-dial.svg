<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Build a caller-owned network RPC client</title>
  <desc id="description">Parse a network JDBC URL, combine the host with default port 1099, dial TCP with the caller context, and wrap the connection in Go net/rpc. The caller owns the returned RPC client and closes it to close the connection. No RPC request or database session starts, and this is not Java RMI.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="760" fill="#fff"/><text class="title" x="600" y="52" text-anchor="middle">Chapter 11 / Build a caller-owned network RPC client</text>
  <rect class="box" x="30" y="145" width="240" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="150" y="180" text-anchor="middle">Data source name</text><text class="small" x="150" y="208" text-anchor="middle">jdbc:simpledb://db.example.org</text>
  <rect class="box" x="320" y="145" width="240" height="90" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="440" y="180" text-anchor="middle">ParseNetworkURL</text><text class="small" x="440" y="208" text-anchor="middle">validate and extract host</text>
  <rect class="box" x="610" y="145" width="240" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="730" y="180" text-anchor="middle">net.JoinHostPort</text><text class="small" x="730" y="208" text-anchor="middle">db.example.org:1099</text>
  <rect class="box" x="900" y="145" width="240" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text class="label" x="1020" y="180" text-anchor="middle">DialContext</text><text class="small" x="1020" y="208" text-anchor="middle">TCP plus caller context</text>
  <rect class="box" x="800" y="365" width="220" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="910" y="400" text-anchor="middle">net.Conn</text><text class="small" x="910" y="428" text-anchor="middle">owned by RPC client</text>
  <rect class="box" x="490" y="365" width="220" height="90" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="600" y="400" text-anchor="middle">rpc.NewClient</text><text class="small" x="600" y="428" text-anchor="middle">Go gob net/rpc</text>
  <rect class="box" x="180" y="365" width="220" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="290" y="400" text-anchor="middle">rpc.Client</text><text class="small" x="290" y="428" text-anchor="middle">caller closes it</text>
  <rect class="box" x="180" y="555" width="840" height="70" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="label" x="600" y="585" text-anchor="middle">No RPC request or database session starts here</text><text class="small" x="600" y="610" text-anchor="middle">Go net/rpc is not Java RMI</text>
  <path class="line" d="M270 190 H320"/><path class="line" d="M560 190 H610"/><path class="line" d="M850 190 H900"/><path class="line" d="M1020 235 V310 H910 V365"/><path class="line" d="M800 410 H710"/><path class="line" d="M490 410 H400"/>
  <text class="small" x="295" y="175" text-anchor="middle">parse</text><text class="small" x="585" y="175" text-anchor="middle">host</text><text class="small" x="875" y="175" text-anchor="middle">dial</text><text class="small" x="960" y="300" text-anchor="middle">success</text><text class="small" x="755" y="395" text-anchor="middle">wrap</text><text class="small" x="445" y="395" text-anchor="middle">return</text>
</svg>
