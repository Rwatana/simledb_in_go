<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Open the selected B-tree leaf page</title>
  <desc id="desc">After directory descent selects a leaf block, the final level-zero directory page is unpinned before the leaf page is pinned with its own record layout. The directory receiver stays closed and the returned leaf pin belongs to the caller.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569" />
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .box { stroke-width: 2; rx: 12; }
      .directory { fill: #dae8fc; stroke: #6c8ebf; }
      .leaf { fill: #d5e8d4; stroke: #82b366; }
      .ownership { fill: #fff2cc; stroke: #d6b656; }
      .label { font-size: 19px; font-weight: 600; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <text class="title" x="600" y="58" text-anchor="middle">Chapter 11 / Feature 59: Open the selected leaf page</text>
  <rect class="box directory" x="100" y="155" width="430" height="130" />
  <text class="label" x="315" y="195" text-anchor="middle">
    <tspan x="315">Level-zero directory page</tspan>
    <tspan x="315" dy="30">FindLeafBlock selected leaf block 11</tspan>
    <tspan x="315" dy="30">Directory layout</tspan>
  </text>
  <rect class="box leaf" x="670" y="155" width="430" height="130" />
  <text class="label" x="885" y="195" text-anchor="middle">
    <tspan x="885">Leaf page · indexleaf block 11</tspan>
    <tspan x="885" dy="30">Leaf-record layout</tspan>
    <tspan x="885" dy="30">Returned pin belongs to caller</tspan>
  </text>
  <rect class="box ownership" x="330" y="430" width="540" height="120" />
  <text class="label" x="600" y="470" text-anchor="middle">
    <tspan x="600">Close directory first, then pin leaf</tspan>
    <tspan x="600" dy="30">Directory receiver remains closed</tspan>
    <tspan x="600" dy="30">No simultaneous pins: one-frame buffer works</tspan>
  </text>
  <path class="arrow" d="M530 220 H662" />
  <text x="596" y="200" text-anchor="middle" font-size="16">same transaction + leaf layout</text>
  <path class="arrow dashed" d="M315 285 C315 370 405 375 440 422" />
  <text x="345" y="360" font-size="16">unpin → pin</text>
</svg>
