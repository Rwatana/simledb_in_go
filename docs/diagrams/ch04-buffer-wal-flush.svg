<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 14: Flush dirty buffer in WAL order</title><desc id="description">log flush、data write、dirty clearの順にBufferを保存する。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#fff"/><text class="title" x="700" y="60" text-anchor="middle">Chapter 4 / Feature 14: Flush dirty buffer in WAL order</text>
  <rect class="box" x="60" y="185" width="280" height="190" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="200" y="230" text-anchor="middle">Dirty Buffer</text><text class="text" x="200" y="285" text-anchor="middle">transaction = 7</text><text class="text" x="200" y="330" text-anchor="middle">recovery LSN = 3</text>
  <rect class="box" x="400" y="185" width="280" height="190" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="540" y="230" text-anchor="middle">1. LogManager.Flush(3)</text><text class="text" x="540" y="310" text-anchor="middle">recovery record durable</text>
  <rect class="box" x="740" y="185" width="280" height="190" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="880" y="230" text-anchor="middle">2. FileManager.Write</text><text class="text" x="880" y="310" text-anchor="middle">data Page durable</text>
  <rect class="box" x="1080" y="185" width="280" height="190" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="1220" y="230" text-anchor="middle">3. Clean Buffer</text><text class="text" x="1220" y="285" text-anchor="middle">transaction = none</text><text class="text" x="1220" y="330" text-anchor="middle">recovery LSN = none</text>
  <g stroke="#475569" stroke-width="3"><line x1="340" y1="280" x2="400" y2="280"/><line x1="680" y1="280" x2="740" y2="280"/><line x1="1020" y1="280" x2="1080" y2="280"/></g><g fill="#475569"><polygon points="400,280 387,272 387,288"/><polygon points="740,280 727,272 727,288"/><polygon points="1080,280 1067,272 1067,288"/></g>
  <rect class="box" x="365" y="485" width="670" height="95" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="700" y="540" text-anchor="middle">Any error stops the sequence. Dirty metadata remains for retry.</text>
  <rect class="box" x="260" y="650" width="880" height="90" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="700" y="705" text-anchor="middle">Write-ahead rule: recovery log becomes durable before the data Page.</text>
</svg>
