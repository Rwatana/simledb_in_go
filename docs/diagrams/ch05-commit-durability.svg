<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" role="img" aria-labelledby="title description">
  <title id="title">Chapter 5 Feature 6: COMMIT durability boundary</title><desc id="description">A COMMIT record is appended before its returned LSN is flushed; either failure stops without retry.</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:17px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1300" height="700" fill="#fff"/><text class="title" x="650" y="68" text-anchor="middle">Chapter 5 / Feature 6: COMMIT durability boundary</text>
  <rect class="box" x="60" y="245" width="230" height="130" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="175" y="292" text-anchor="middle">Encode COMMIT(tx)</text><text class="text" x="175" y="340" text-anchor="middle">8 bytes</text>
  <rect class="box" x="385" y="245" width="230" height="130" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="500" y="292" text-anchor="middle">Append(record)</text><text class="text" x="500" y="340" text-anchor="middle">returns LSN</text>
  <rect class="box" x="710" y="245" width="230" height="130" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="825" y="292" text-anchor="middle">Flush(LSN)</text><text class="text" x="825" y="340" text-anchor="middle">same LSN</text>
  <rect class="box" x="1035" y="245" width="230" height="130" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="1150" y="292" text-anchor="middle">Durable COMMIT</text><text class="text" x="1150" y="340" text-anchor="middle">return LSN</text>
  <path d="M290 310 H385 M615 310 H710 M940 310 H1035" stroke="#475569" stroke-width="3" fill="none"/><polygon points="385,310 371,302 371,318" fill="#475569"/><polygon points="710,310 696,302 696,318" fill="#475569"/><polygon points="1035,310 1021,302 1021,318" fill="#475569"/>
  <rect class="box" x="385" y="485" width="230" height="110" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="500" y="530" text-anchor="middle">Append error</text><text class="text" x="500" y="568" text-anchor="middle">no Flush call</text>
  <rect class="box" x="710" y="485" width="230" height="110" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="825" y="530" text-anchor="middle">Flush error</text><text class="text" x="825" y="568" text-anchor="middle">no retry</text>
  <path d="M500 375 V485 M825 375 V485" stroke="#b85450" stroke-width="3" fill="none"/><polygon points="500,485 492,471 508,471" fill="#b85450"/><polygon points="825,485 817,471 833,471" fill="#b85450"/>
</svg>
