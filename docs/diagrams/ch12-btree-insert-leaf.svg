<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">B-tree leaf entry insertion</title>
  <desc id="desc">Insert a key and record identifier at slot one by shifting the later leaf entry right, then write the record count, key, RID block, and RID id.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569" />
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .slot { stroke-width: 2; rx: 12; }
      .before { fill: #dae8fc; stroke: #6c8ebf; }
      .unused { fill: #f8cecc; stroke: #b85450; }
      .step { fill: #e1d5e7; stroke: #9673a6; }
      .write { fill: #fff2cc; stroke: #d6b656; }
      .after { fill: #d5e8d4; stroke: #82b366; }
    </style>
  </defs>
  <text class="title" x="600" y="58" text-anchor="middle">Chapter 12 / Feature 51: Insert a B-tree leaf entry</text>
  <text class="label" x="600" y="105" text-anchor="middle">Before · count = 2 · insert at slot 1</text>
  <rect class="slot before" x="130" y="130" width="270" height="108" />
  <rect class="slot before" x="465" y="130" width="270" height="108" />
  <rect class="slot unused" x="800" y="130" width="270" height="108" />
  <text x="265" y="163" text-anchor="middle" font-size="18"><tspan x="265">slot 0</tspan><tspan x="265" dy="27">key alpha</tspan><tspan x="265" dy="27">RID (10, 1)</tspan></text>
  <text x="600" y="163" text-anchor="middle" font-size="18"><tspan x="600">slot 1</tspan><tspan x="600" dy="27">key omega</tspan><tspan x="600" dy="27">RID (20, 2)</tspan></text>
  <text x="935" y="179" text-anchor="middle" font-size="18"><tspan x="935">slot 2</tspan><tspan x="935" dy="27">unused</tspan></text>
  <path d="M735 184 H790" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <text x="758" y="163" text-anchor="middle" font-size="14">right-to-left</text>
  <rect class="slot step" x="210" y="280" width="780" height="86" />
  <text x="600" y="315" text-anchor="middle" font-size="20" font-weight="700"><tspan x="600">Shift complete entries right-to-left</tspan><tspan x="600" dy="28">slot 1 → slot 2 · copy dataval, block, and id</tspan></text>
  <path d="M600 366 V398" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <rect class="slot write" x="210" y="405" width="780" height="78" />
  <text x="600" y="438" text-anchor="middle" font-size="19" font-weight="700"><tspan x="600">Increment count, write key, then write RID block and id</tspan><tspan x="600" dy="27">Every page update requests transaction logging</tspan></text>
  <path d="M600 483 V498" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <text class="label" x="600" y="531" text-anchor="middle">After · count = 3</text>
  <rect class="slot after" x="60" y="548" width="340" height="76" />
  <rect class="slot after" x="430" y="548" width="340" height="76" />
  <rect class="slot after" x="800" y="548" width="340" height="76" />
  <text x="230" y="594" text-anchor="middle" font-size="17">slot 0 · alpha · RID (10, 1)</text>
  <text x="600" y="594" text-anchor="middle" font-size="17">slot 1 · middle · RID (15, 7)</text>
  <text x="970" y="594" text-anchor="middle" font-size="17">slot 2 · omega · RID (20, 2)</text>
  <text x="600" y="658" text-anchor="middle" font-size="15" fill="#475569">Capacity checks and B-tree splitting remain the caller's responsibility.</text>
</svg>
