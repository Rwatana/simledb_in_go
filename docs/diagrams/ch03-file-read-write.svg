<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 3 Feature 3: FileManager read and write</title>
  <desc id="description">BlockIDのblock番号とblock sizeからfile offsetを計算し、Pageとdatabase fileのfixed-size blockをWriteAtとReadAtで往復する流れ。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#82b366"/></marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9673a6"/></marker>
    <style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.small{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#4b5563}.box{stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.green-line{fill:none;stroke:#82b366;stroke-width:3;marker-end:url(#green-arrow)}.purple-line{fill:none;stroke:#9673a6;stroke-width:3;marker-end:url(#purple-arrow)}</style>
  </defs>
  <rect width="1400" height="850" fill="#ffffff"/>
  <text class="title" x="700" y="55" text-anchor="middle">Chapter 3 / Feature 3: FileManager read / write</text>

  <rect class="box" x="70" y="150" width="250" height="150" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="heading" x="195" y="185" text-anchor="middle">BlockID</text><text class="text" x="195" y="225" text-anchor="middle">file: student.tbl</text><text class="text" x="195" y="258" text-anchor="middle">number: 2</text>

  <rect class="box" x="455" y="125" width="340" height="205" rx="12" fill="#fff2cc" stroke="#d6b656"/>
  <text class="heading" x="625" y="165" text-anchor="middle">FileManager</text><text class="text" x="625" y="207" text-anchor="middle">directory: /tmp/db</text><text class="text" x="625" y="239" text-anchor="middle">block size: 32 bytes</text><text class="heading" x="625" y="290" text-anchor="middle">offset = 2 × 32 = 64</text>
  <line x1="320" y1="225" x2="455" y2="225" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box" x="930" y="105" width="390" height="300" rx="12" fill="#f8fafc" stroke="#475569"/>
  <text class="heading" x="1125" y="145" text-anchor="middle">/tmp/db/student.tbl</text>
  <rect class="box" x="955" y="170" width="340" height="60" fill="#dae8fc" stroke="#6c8ebf"/><text class="text" x="1125" y="195" text-anchor="middle">block 0</text><text class="small" x="1125" y="218" text-anchor="middle">offset 0..31</text>
  <rect class="box" x="955" y="230" width="340" height="60" fill="#f5f5f5" stroke="#9ca3af"/><text class="text" x="1125" y="255" text-anchor="middle">block 1</text><text class="small" x="1125" y="278" text-anchor="middle">offset 32..63</text>
  <rect x="955" y="290" width="340" height="60" fill="#d5e8d4" stroke="#82b366" stroke-width="4"/><text class="heading" x="1125" y="315" text-anchor="middle">block 2</text><text class="small" x="1125" y="338" text-anchor="middle">offset 64..95</text>
  <line x1="795" y1="227" x2="930" y2="227" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box" x="520" y="520" width="270" height="120" rx="12" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="heading" x="655" y="565" text-anchor="middle">Page</text><text class="text" x="655" y="602" text-anchor="middle">capacity: 32 bytes</text>
  <rect class="box" x="855" y="505" width="400" height="70" rx="12" fill="#d5e8d4" stroke="#82b366"/>
  <text class="heading" x="1055" y="548" text-anchor="middle">Write: Snapshot() → WriteAt(offset)</text>
  <rect class="box" x="855" y="610" width="400" height="70" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="heading" x="1055" y="653" text-anchor="middle">Read: ReadAt(offset) → NewPageFromBytes</text>
  <line x1="790" y1="550" x2="855" y2="550" stroke="#82b366" stroke-width="3" marker-end="url(#green-arrow)"/><line x1="855" y1="645" x2="790" y2="600" stroke="#9673a6" stroke-width="3" marker-end="url(#purple-arrow)"/>

  <rect class="box" x="260" y="750" width="880" height="65" rx="12" fill="#f8cecc" stroke="#b85450"/>
  <text class="heading" x="700" y="790" text-anchor="middle">Dependency: infrastructure/file → storage.BlockID + storage.Page</text>
</svg>
