<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Buffer root estimator</title>
  <desc id="desc">BestRoot reserves two buffers, returns one for a small budget or size, then increases the exponent until an exact ceiling root fits the remaining buffer budget.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52677d"/></marker>
    <style>
      text { font: 16px sans-serif; fill: #172b4d; text-anchor: middle; }
      .small { font-size: 13px; }
      .input { fill: #dae8fc; stroke: #6c8ebf; }
      .step { fill: #fff2cc; stroke: #d6b656; }
      .work { fill: #d5e8d4; stroke: #82b366; }
      .result { fill: #d5e8d4; stroke: #82b366; }
      .fallback { fill: #f8cecc; stroke: #b85450; }
      .decision { fill: #e1d5e7; stroke: #9673a6; }
      .edge { fill: none; stroke: #52677d; stroke-width: 2; marker-end: url(#arrow); }
      .box { stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1120" height="560" fill="#fff"/>
  <rect class="input box" x="40" y="210" width="190" height="82"/>
  <text x="135" y="240">Inputs</text><text class="small" x="135" y="266">available buffers; blocks</text>
  <rect class="step box" x="300" y="210" width="210" height="82"/>
  <text x="405" y="240">Reserve two buffers</text><text class="small" x="405" y="266">usable = available - 2</text>
  <polygon class="decision" points="657,190 730,250 657,310 585,250" stroke-width="2"/>
  <text class="small" x="657" y="245">usable ≤ 1</text><text class="small" x="657" y="266">or size ≤ 1?</text>
  <rect class="fallback box" x="830" y="70" width="150" height="60"/>
  <text x="905" y="106">Return 1</text>
  <rect class="work box" x="800" y="220" width="210" height="82"/>
  <text x="905" y="249">Increase exponent</text><text class="small" x="905" y="275">compute ceiling root</text>
  <polygon class="decision" points="640,380 720,435 640,490 560,435" stroke-width="2"/>
  <text class="small" x="640" y="440">root ≤ usable?</text>
  <rect class="result box" x="300" y="405" width="170" height="60"/>
  <text x="385" y="441">Return root</text>
  <path class="edge" d="M230 251 H300"/><path class="edge" d="M510 251 H585"/>
  <path class="edge" d="M690 210 L830 117"/><text class="small" x="760" y="154">yes</text>
  <path class="edge" d="M730 250 H800"/><text class="small" x="764" y="238">no</text>
  <path class="edge" d="M905 302 L690 390"/>
  <path class="edge" d="M560 435 H470"/><text class="small" x="515" y="425">yes</text>
  <path class="edge" d="M640 490 V520 H905 V302"/><text class="small" x="790" y="515">no: next exponent</text>
</svg>
