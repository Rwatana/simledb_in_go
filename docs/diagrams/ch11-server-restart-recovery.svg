<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Recover a database after restart</title>
  <desc id="description">The caller explicitly asks Managers to recover a reopened database. Managers creates a fresh transaction. The transaction scans durable log history, undoes unfinished updates, flushes the restored pages and CHECKPOINT, then Managers commits the recovery transaction and returns the checkpoint LSN. Recovery and commit errors return with context.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="error-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 17px system-ui,sans-serif;fill:#111827}.small{font:14px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.errorline{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#error-arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text class="title" x="600" y="48" text-anchor="middle">Chapter 11 / Recover a database after restart</text>
  <rect class="box" x="35" y="220" width="165" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="117" y="255" text-anchor="middle">Caller</text>
  <text class="small" x="117" y="282" text-anchor="middle">requests recovery</text>
  <rect class="box" x="245" y="205" width="210" height="120" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="350" y="245" text-anchor="middle">Managers.Recover()</text>
  <text class="small" x="350" y="276" text-anchor="middle">create transaction</text>
  <text class="small" x="350" y="300" text-anchor="middle">commit after recovery</text>
  <rect class="box" x="510" y="190" width="230" height="150" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="625" y="230" text-anchor="middle">Recovery transaction</text>
  <text class="small" x="625" y="263" text-anchor="middle">scan log · undo updates</text>
  <text class="small" x="625" y="291" text-anchor="middle">flush CHECKPOINT</text>
  <text class="small" x="625" y="319" text-anchor="middle">release locks and buffers</text>
  <rect class="box" x="800" y="90" width="220" height="125" rx="14" fill="#f3f4f6" stroke="#4b5563"/>
  <text class="label" x="910" y="129" text-anchor="middle">Durable log</text>
  <text class="small" x="910" y="160" text-anchor="middle">history · CHECKPOINT</text>
  <text class="small" x="910" y="187" text-anchor="middle">COMMIT follows checkpoint</text>
  <rect class="box" x="800" y="340" width="220" height="125" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="910" y="379" text-anchor="middle">Database buffers</text>
  <text class="small" x="910" y="410" text-anchor="middle">undo uncommitted pages</text>
  <text class="small" x="910" y="437" text-anchor="middle">flush restored pages</text>
  <rect class="box" x="1050" y="220" width="135" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="1117" y="253" text-anchor="middle">Ready</text>
  <text class="small" x="1117" y="280" text-anchor="middle">checkpoint LSN</text>
  <rect class="box" x="325" y="440" width="360" height="105" rx="14" fill="#fee2e2" stroke="#dc2626"/>
  <text class="label" x="505" y="480" text-anchor="middle">Restart error</text>
  <text class="small" x="505" y="512" text-anchor="middle">recovery or commit failure keeps context</text>
  <path class="line" d="M200 265 H245"/>
  <path class="line" d="M455 265 H510"/>
  <text class="small" x="482" y="250" text-anchor="middle">fresh transaction</text>
  <path class="line" d="M740 235 H770 V150 H800"/>
  <text class="small" x="772" y="222" text-anchor="middle">read / append</text>
  <path class="line" d="M740 295 H770 V400 H800"/>
  <text class="small" x="772" y="350" text-anchor="middle">undo / flush</text>
  <path class="line" d="M1020 150 H1035 V240 H1050"/>
  <text class="small" x="1035" y="210" text-anchor="middle">durable</text>
  <path class="line" d="M455 300 H480 V492 H685 V340"/>
  <text class="small" x="466" y="414" text-anchor="middle">commit only after CHECKPOINT</text>
  <path class="errorline" d="M625 340 V420 H685"/>
  <path class="errorline" d="M510 275 H480 V440"/>
  <text class="small" x="470" y="393" text-anchor="middle">wrapped error</text>
</svg>
