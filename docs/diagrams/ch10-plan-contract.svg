  <rect class="box" x="980" y="125" width="280" height="195" fill="#d5e8d4" stroke="#82b366"/>
  <text class="label" x="1120" y="153" style="font-size:13px"><tspan x="1120">query.Scan</tspan><tspan x="1120" dy="21">TablePlan: RecordScan adapter</tspan><tspan x="1120" dy="21">SelectPlan: SelectScan filter</tspan><tspan x="1120" dy="21">ProductPlan: ProductScan</tspan><tspan x="1120" dy="21">ProjectPlan: ProjectScan</tspan><tspan x="1120" dy="21">left-major Cartesian traversal</tspan><tspan x="1120" dy="21">Open returns (Scan, error)</tspan></text>
  <rect class="box" x="980" y="390" width="280" height="250" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="label" x="1120" y="408" style="font-size:11px"><tspan x="1120">Plan metadata and schema</tspan><tspan x="1120" dy="21">block-access estimate</tspan><tspan x="1120" dy="21">TablePlan: table row estimate</tspan><tspan x="1120" dy="21">SelectPlan: rows / predicate factor</tspan><tspan x="1120" dy="21">distinct: 1 for constant; min for field equality</tspan><tspan x="1120" dy="21">ProductPlan: B(left) + R(left) × B(right)</tspan><tspan x="1120" dy="21">ProductPlan: R(left) × R(right)</tspan><tspan x="1120" dy="21">ProductPlan distinct: route by child schema</tspan><tspan x="1120" dy="21">ProductPlan: left/right schema union</tspan><tspan x="1120" dy="21">ProjectPlan: selected schema</tspan><tspan x="1120" dy="21">record.Schema</tspan></text>
  <rect class="box" x="420" y="565" width="470" height="90" fill="#f8cecc" stroke="#b85450"/>
