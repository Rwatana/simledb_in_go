<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title description">
  <title id="title">Chapter 10 Features 1–17: Plans and predicate estimates</title>
  <desc id="description">The Plan contract represents a relational query tree and exposes a scan, estimates, and schema. ProductPlan combines child schemas in left-to-right order, opens both child scans as an initialized left-major ProductScan, estimates nested-loop block accesses as B(left) + R(left) × B(right), estimates output rows as R(left) × R(right) using Java-compatible signed 32-bit arithmetic, and routes distinct-value estimates according to child schema with left-side precedence. ProjectPlan copies the requested output field definitions in order. TablePlan retains a table transaction, name, resolved layout, and statistics, exposes that layout's schema, opens a query RecordScan adapter, and reads block-access, output-row, and distinct-value estimates from StatInfo. SelectPlan opens its child plan, returns a SelectScan that filters rows by its predicate, preserves the child's output schema, delegates block access, estimates output rows by dividing by the predicate reduction factor, and adjusts distinct values for field-to-constant and field-to-field equalities.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>.title{font:700 25px sans-serif;fill:#1f2937}.box{stroke-width:2;rx:18;ry:18}.label{font:17px sans-serif;fill:#1f2937;text-anchor:middle}.small{font:15px sans-serif;fill:#475569;text-anchor:middle}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
