<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Parse and plan a SELECT query</title>
  <desc id="description">The application sends SQL SELECT text to the parser. Parsed query data and the same caller-owned transaction are passed to the server manager set's basic query planner, which consults shared metadata and returns an executable plan. Errors go back to the caller and transaction ownership does not change.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.boundary{fill:#faf5ff;stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 5}
    </style>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text class="title" x="550" y="48" text-anchor="middle">Chapter 11 / Parse and plan a SELECT query</text>
  <rect class="box" x="30" y="185" width="220" height="100" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="140" y="222" text-anchor="middle">Application caller</text>
  <text class="small" x="140" y="252" text-anchor="middle">SELECT SQL + active transaction</text>
  <rect class="box" x="315" y="185" width="220" height="100" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="425" y="222" text-anchor="middle">Parser.ParseQuery</text>
  <text class="small" x="425" y="252" text-anchor="middle">SQL text → QueryData</text>
  <rect class="boundary" x="600" y="105" width="280" height="330" rx="20"/>
  <text class="label" x="740" y="138" text-anchor="middle">Server manager set</text>
  <rect class="box" x="640" y="165" width="200" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="740" y="203" text-anchor="middle">QueryPlanner</text>
  <text class="small" x="740" y="230" text-anchor="middle">BasicQueryPlanner</text>
  <rect class="box" x="640" y="310" width="200" height="80" rx="14" fill="#fce7f3" stroke="#db2777"/>
  <text class="label" x="740" y="343" text-anchor="middle">Shared metadata</text>
  <text class="small" x="740" y="369" text-anchor="middle">table layouts · statistics</text>
  <rect class="box" x="920" y="185" width="160" height="100" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="1000" y="222" text-anchor="middle">Executable plan</text>
  <text class="small" x="1000" y="252" text-anchor="middle">projection · scan</text>
  <path class="line" d="M250 235 H315"/>
  <text class="small" x="282" y="220" text-anchor="middle">SQL</text>
  <path class="line" d="M535 235 H640"/>
  <text class="small" x="590" y="218" text-anchor="middle">QueryData</text>
  <path d="M140 185 V130 H740 V165" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text class="small" x="440" y="122" text-anchor="middle">same caller-owned transaction</text>
  <path class="line" d="M740 255 V310"/>
  <text class="small" x="740" y="290" text-anchor="middle">schema and estimates</text>
  <path class="line" d="M840 210 H920"/>
  <text class="small" x="880" y="195" text-anchor="middle">returns plan</text>
  <text class="small" x="550" y="500" text-anchor="middle">Errors return to the caller; transaction ownership is unchanged. UPDATE dispatch is separate.</text>
</svg>
