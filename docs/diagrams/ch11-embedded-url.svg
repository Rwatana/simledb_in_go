<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Embedded database URL configuration</title>
  <desc id="description">A JDBC-compatible data source name is parsed into its unchanged database-name suffix. The caller chooses storage settings, constructs managers and binds them to an embedded connector passed to sql.OpenDB.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1300" height="700" fill="#fff"/>
  <text class="title" x="650" y="52" text-anchor="middle">Chapter 11 / Embedded database URL configuration</text>
  <rect class="box" x="40" y="135" width="230" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="155" y="170" text-anchor="middle">Data source name</text><text class="small" x="155" y="198" text-anchor="middle">jdbc:simpledb:studentdb</text>
  <rect class="box" x="330" y="135" width="250" height="90" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="455" y="170" text-anchor="middle">ParseEmbeddedURL</text><text class="small" x="455" y="198" text-anchor="middle">validates prefix and name</text>
  <rect class="box" x="640" y="135" width="250" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="765" y="170" text-anchor="middle">Database name</text><text class="small" x="765" y="198" text-anchor="middle">studentdb (suffix preserved)</text>
  <rect class="box" x="950" y="135" width="260" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text class="label" x="1080" y="170" text-anchor="middle">Caller selects</text><text class="small" x="1080" y="198" text-anchor="middle">directory and manager settings</text>
  <rect class="box" x="950" y="365" width="260" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="1080" y="400" text-anchor="middle">server.NewManagers</text><text class="small" x="1080" y="428" text-anchor="middle">configured storage</text>
  <rect class="box" x="640" y="365" width="250" height="90" rx="14" fill="#fce7f3" stroke="#db2777"/><text class="label" x="765" y="400" text-anchor="middle">embedded.NewConnector</text><text class="small" x="765" y="428" text-anchor="middle">manager-bound driver</text>
  <rect class="box" x="330" y="365" width="250" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="455" y="400" text-anchor="middle">sql.OpenDB(connector)</text><text class="small" x="455" y="428" text-anchor="middle">in-process database</text>
  <path class="line" d="M270 180 H330"/><text class="small" x="300" y="165" text-anchor="middle">parse</text>
  <path class="line" d="M580 180 H640"/><text class="small" x="610" y="165" text-anchor="middle">suffix</text>
  <path class="line" d="M890 180 H950"/><text class="small" x="920" y="165" text-anchor="middle">caller policy</text>
  <path class="line" d="M1080 225 V365"/><text class="small" x="1147" y="303">initialize</text>
  <path class="line" d="M950 410 H890"/><text class="small" x="920" y="395" text-anchor="middle">bind</text>
  <path class="line" d="M640 410 H580"/><text class="small" x="610" y="395" text-anchor="middle">open</text>
  <text class="small" x="650" y="575" text-anchor="middle">Parsing does not create directories or managers; no global driver registration is required.</text>
</svg>
