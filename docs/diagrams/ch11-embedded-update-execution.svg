<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Transaction-bound embedded update execution</title>
  <desc id="description">An application executes an update through sql.Tx. The embedded statement sends the SQL and the connection's currently active transaction to server.Managers.ExecuteUpdate, which parses and delegates to the update planner and transaction. The call returns the affected-row count but leaves commit or rollback to the caller's database/sql transaction.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.blue{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrow)}.muted{fill:none;stroke:#6b7280;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text class="title" x="600" y="50" text-anchor="middle">Chapter 11 / Transaction-bound embedded update execution</text>
  <rect class="box" x="35" y="150" width="220" height="95" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="145" y="189" text-anchor="middle">application</text>
  <text class="small" x="145" y="218" text-anchor="middle">sql.Tx.Exec(query)</text>
  <rect class="box" x="345" y="150" width="250" height="95" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="470" y="189" text-anchor="middle">embedded.statement</text>
  <text class="small" x="470" y="218" text-anchor="middle">driver.Stmt.Exec</text>
  <rect class="box" x="700" y="150" width="280" height="95" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="840" y="189" text-anchor="middle">server.Managers</text>
  <text class="small" x="840" y="218" text-anchor="middle">ExecuteUpdate(query, tx)</text>
  <rect class="box" x="345" y="385" width="250" height="100" rx="14" fill="#dbeafe" stroke="#2563eb"/>
  <text class="label" x="470" y="425" text-anchor="middle">embedded.Connection</text>
  <text class="small" x="470" y="454" text-anchor="middle">holds active transaction</text>
  <rect class="box" x="700" y="385" width="280" height="95" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="840" y="425" text-anchor="middle">plan.UpdatePlanner</text>
  <text class="small" x="840" y="454" text-anchor="middle">executes parsed command</text>
  <rect class="box" x="700" y="535" width="280" height="75" rx="14" fill="#fce7f3" stroke="#db2777"/>
  <text class="label" x="840" y="568" text-anchor="middle">transaction.Transaction</text>
  <text class="small" x="840" y="591" text-anchor="middle">mutations remain uncommitted</text>
  <rect class="box" x="35" y="385" width="220" height="100" rx="14" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="label" x="145" y="425" text-anchor="middle">transactionAdapter</text>
  <text class="small" x="145" y="454" text-anchor="middle">driver.Tx</text>
  <path class="line" d="M255 197 H345"/><text class="small" x="300" y="182" text-anchor="middle">SQL</text>
  <path class="line" d="M595 197 H700"/><text class="small" x="647" y="182" text-anchor="middle">update text</text>
  <path class="blue" d="M470 385 V245"/><text class="small" x="490" y="325">active tx</text>
  <path class="line" d="M840 245 V385"/><text class="small" x="895" y="320">parse / dispatch</text>
  <path class="line" d="M840 480 V535"/><text class="small" x="915" y="515">mutation</text>
  <path class="muted" d="M255 435 H625 V572 H700"/><text class="small" x="480" y="555" text-anchor="middle">Commit / Rollback later</text>
  <text class="small" x="600" y="632" text-anchor="middle">Exec returns RowsAffected and leaves the transaction open for explicit completion.</text>
</svg>
