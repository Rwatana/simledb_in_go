<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 13: Assign first buffer block</title><desc id="description">target blockをtemporary Pageへreadした後、BufferのBlockIDとContentsをcommitする。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/><text class="title" x="700" y="60" text-anchor="middle">Chapter 4 / Feature 13: Assign first buffer block</text>
  <rect class="box" x="80" y="185" width="320" height="190" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="240" y="230" text-anchor="middle">Unassigned Buffer</text><text class="text" x="240" y="285" text-anchor="middle">clean · pin count 0</text><text class="text" x="240" y="330" text-anchor="middle">zero-filled contents</text>
  <rect class="box" x="540" y="185" width="320" height="190" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="700" y="230" text-anchor="middle">Read target block</text><text class="text" x="700" y="285" text-anchor="middle">into temporary Page</text><text class="text" x="700" y="330" text-anchor="middle">state not changed yet</text>
  <rect class="box" x="1000" y="185" width="320" height="190" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="1160" y="230" text-anchor="middle">Assigned Buffer</text><text class="text" x="1160" y="285" text-anchor="middle">BlockID = target</text><text class="text" x="1160" y="330" text-anchor="middle">Contents = disk Page</text>
  <line x1="400" y1="280" x2="540" y2="280" stroke="#475569" stroke-width="3"/><polygon points="540,280 527,272 527,288" fill="#475569"/><text class="text" x="470" y="260" text-anchor="middle">validate</text>
  <line x1="860" y1="280" x2="1000" y2="280" stroke="#475569" stroke-width="3"/><polygon points="1000,280 987,272 987,288" fill="#475569"/><text class="text" x="930" y="260" text-anchor="middle">commit after success</text>
  <rect class="box" x="365" y="480" width="670" height="100" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="700" y="522" text-anchor="middle">Read error or invalid state → return error</text><text class="text" x="700" y="558" text-anchor="middle">BlockID and Contents stay unchanged</text>
  <rect class="box" x="260" y="650" width="880" height="90" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="700" y="705" text-anchor="middle">I/O completes before the frame publishes its first BlockID.</text>
</svg>
