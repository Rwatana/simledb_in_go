<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" role="img" aria-labelledby="title desc"><title id="title">Product scan</title><desc id="desc">A product scan pairs each outer row from the left scan with each inner row from the right scan, restarting the right scan for every left row.</desc><style>.t{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.h{font-family:Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;fill:#1f2937}.x{font-family:Helvetica,Arial,sans-serif;font-size:17px;fill:#1f2937}</style><rect width="1300" height="700" fill="#fff"/><text class="t" x="650" y="70" text-anchor="middle">Chapter 8 / Feature 29: Product scan</text><rect x="70" y="260" width="260" height="150" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text class="h" x="200" y="315" text-anchor="middle">Left Scan</text><text class="x" x="200" y="370" text-anchor="middle">advance outer row</text><rect x="510" y="260" width="300" height="150" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text class="h" x="660" y="315" text-anchor="middle">ProductScan</text><text class="x" x="660" y="370" text-anchor="middle">nested-loop pair</text><rect x="510" y="500" width="300" height="120" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text class="h" x="660" y="545" text-anchor="middle">Right Scan</text><text class="x" x="660" y="585" text-anchor="middle">restart per left row</text><rect x="960" y="260" width="270" height="150" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text class="h" x="1095" y="300" text-anchor="middle">Output pairs</text><text class="x" x="1095" y="340" text-anchor="middle">left-major order</text><text class="x" x="1095" y="372" text-anchor="middle">left field wins duplicates</text><rect x="70" y="500" width="330" height="120" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text class="x" x="235" y="540" text-anchor="middle">reset / next / read failure</text><text class="x" x="235" y="570" text-anchor="middle">contextual error</text><text class="x" x="235" y="600" text-anchor="middle">close attempts both inputs</text><path d="M330 335H510 M660 500V410 M810 335H960 M510 380H450V455H200V410 M510 410H450V500 M660 410V500" stroke="#475569" stroke-width="3" fill="none"/><polygon points="510,335 496,327 496,343" fill="#475569"/><polygon points="660,410 652,396 668,396" fill="#475569"/><polygon points="960,335 946,327 946,343" fill="#475569"/><polygon points="200,410 192,396 208,396" fill="#475569"/><polygon points="510,500 502,486 518,486" fill="#475569"/></svg>
