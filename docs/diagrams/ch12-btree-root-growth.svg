<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 12 Feature 77: Grow the fixed-block B-tree directory root</title>
  <desc id="desc">After a directory root splits, move its entries to a new page, install two child entries in block zero, and raise the root level last.</desc>
  <style>.title{font-family:Arial,sans-serif;font-size:27px;font-weight:700;fill:#1f2937}.head{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#1f2937}.body{font-family:Arial,sans-serif;font-size:17px;fill:#1f2937}.small{font-family:Arial,sans-serif;font-size:15px;fill:#475569}</style>
  <rect width="1280" height="700" fill="#fff"/>
  <text class="title" x="640" y="55" text-anchor="middle">Chapter 12 / Feature 77: Grow the fixed-block B-tree root</text>
  <g stroke="#6c8ebf" stroke-width="2" fill="#dae8fc">
    <rect x="45" y="115" width="360" height="245" rx="12"/>
    <rect x="460" y="115" width="360" height="245" rx="12"/>
    <rect x="875" y="115" width="360" height="245" rx="12"/>
  </g>
  <text class="head" x="225" y="151" text-anchor="middle">1 · Before root growth</text>
  <text class="body" x="225" y="185" text-anchor="middle">block 0 · level L</text>
  <rect x="78" y="204" width="294" height="48" rx="7" fill="#fff" stroke="#6c8ebf"/>
  <rect x="78" y="260" width="294" height="48" rx="7" fill="#fff" stroke="#6c8ebf"/>
  <text class="body" x="225" y="234" text-anchor="middle">key 10 → child A</text>
  <text class="body" x="225" y="290" text-anchor="middle">key 20 → child B</text>
  <text class="small" x="225" y="337" text-anchor="middle">split returned separator: 30 → page R</text>
  <text class="head" x="640" y="151" text-anchor="middle">2 · Move old root entries</text>
  <text class="body" x="640" y="185" text-anchor="middle">append page N · level L</text>
  <rect x="493" y="204" width="294" height="48" rx="7" fill="#e1d5e7" stroke="#9673a6"/>
  <rect x="493" y="260" width="294" height="48" rx="7" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="body" x="640" y="234" text-anchor="middle">key 10 → child A</text>
  <text class="body" x="640" y="290" text-anchor="middle">key 20 → child B</text>
  <text class="small" x="640" y="337" text-anchor="middle">block zero stays reserved for the root</text>
  <text class="head" x="1055" y="151" text-anchor="middle">3 · Install the new root</text>
  <text class="body" x="1055" y="185" text-anchor="middle">block 0 · level L + 1</text>
  <rect x="908" y="204" width="294" height="48" rx="7" fill="#d5e8d4" stroke="#82b366"/>
  <rect x="908" y="260" width="294" height="48" rx="7" fill="#d5e8d4" stroke="#82b366"/>
  <text class="body" x="1055" y="234" text-anchor="middle">key 10 → page N</text>
  <text class="body" x="1055" y="290" text-anchor="middle">key 30 → page R</text>
  <text class="small" x="1055" y="337" text-anchor="middle">write both entries; raise level last</text>
  <path d="M405 237 H451" stroke="#475569" stroke-width="3"/>
  <polygon points="451,237 437,229 437,245" fill="#475569"/>
  <path d="M820 237 H866" stroke="#475569" stroke-width="3"/>
  <polygon points="866,237 852,229 852,245" fill="#475569"/>
  <rect x="180" y="430" width="920" height="100" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text class="head" x="640" y="468" text-anchor="middle">Validate key order before allocating; rely on transaction rollback after mutation starts</text>
  <text class="body" x="640" y="502" text-anchor="middle">The root never moves from block 0, and its level changes only after both child entries are written.</text>
  <text class="small" x="640" y="625" text-anchor="middle">Root growth follows recursive split propagation; formatting an initial root is a separate operation.</text>
</svg>
