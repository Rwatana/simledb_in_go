<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" role="img" aria-labelledby="title desc"><title id="title">Recovery record dispatch</title><desc id="desc">DecodeRecord reads an operation and selects one of six strict decoders.</desc><style>.t{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.h{font-family:Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;fill:#1f2937}.x{font-family:Helvetica,Arial,sans-serif;font-size:17px;fill:#1f2937}</style><rect width="1300" height="700" fill="#fff"/><text class="t" x="650" y="70" text-anchor="middle">Chapter 5 / Feature 14: Recovery record dispatch</text><rect x="70" y="265" width="260" height="150" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text class="h" x="200" y="315" text-anchor="middle">Raw log bytes</text><text class="x" x="200" y="370" text-anchor="middle">read int32 operation</text><rect x="460" y="265" width="260" height="150" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text class="h" x="590" y="315" text-anchor="middle">DecodeRecord</text><text class="x" x="590" y="370" text-anchor="middle">switch 0…5</text><rect x="850" y="220" width="380" height="240" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text class="h" x="1040" y="275" text-anchor="middle">Strict typed decoder</text><text class="x" x="1040" y="330" text-anchor="middle">CHECKPOINT · START · COMMIT</text><text class="x" x="1040" y="370" text-anchor="middle">ROLLBACK · SETINT · SETSTRING</text><rect x="460" y="520" width="360" height="90" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text class="h" x="640" y="575" text-anchor="middle">short prefix or unknown op → error</text><path d="M330 340H460 M720 340H850 M590 415V520" stroke="#475569" stroke-width="3" fill="none"/><polygon points="460,340 446,332 446,348" fill="#475569"/><polygon points="850,340 836,332 836,348" fill="#475569"/><polygon points="590,520 582,506 598,506" fill="#475569"/></svg>
