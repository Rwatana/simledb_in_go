<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 5 lock release notification</title><desc id="description">A final release wakes all lock waiters; a shared count reaching one also wakes a registered exclusive upgrader.</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/><text class="title" x="700" y="58" text-anchor="middle">Chapter 5 / Features 44 and 47: Lock release notifications</text>
  <rect class="box" x="70" y="260" width="290" height="180" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="215" y="305" text-anchor="middle">Registered lock waiter</text><text class="text" x="215" y="355" text-anchor="middle">Cond.Wait()</text><text class="text" x="215" y="400" text-anchor="middle">releases LockTable mutex</text>
  <rect class="box" x="490" y="260" width="280" height="170" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="630" y="310" text-anchor="middle">LockTable.Unlock</text><text class="text" x="630" y="370" text-anchor="middle">under the same mutex</text>
  <rect class="box" x="930" y="95" width="300" height="200" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="1080" y="135" text-anchor="middle">shared count &gt; 1</text><text class="text" x="1080" y="180" text-anchor="middle">decrement count</text><text class="text" x="1080" y="225" text-anchor="middle">at count 1: broadcast only</text><text class="text" x="1080" y="260" text-anchor="middle">for registered exclusive waiter</text>
  <rect class="box" x="930" y="390" width="300" height="190" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="1080" y="435" text-anchor="middle">final shared or exclusive</text><text class="text" x="1080" y="490" text-anchor="middle">delete block entry</text><text class="text" x="1080" y="535" text-anchor="middle">Cond.Broadcast()</text>
  <rect class="box" x="490" y="570" width="280" height="145" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="630" y="615" text-anchor="middle">Waiter reacquires mutex</text><text class="text" x="630" y="670" text-anchor="middle">rechecks lock predicate</text>
  <line x1="360" y1="350" x2="490" y2="350" stroke="#475569" stroke-width="3"/><polygon points="490,350 476,342 476,358" fill="#475569"/>
  <line x1="770" y1="300" x2="930" y2="192" stroke="#475569" stroke-width="3"/><polygon points="930,192 915,192 923,205" fill="#475569"/>
  <line x1="770" y1="390" x2="930" y2="485" stroke="#475569" stroke-width="3"/><polygon points="930,485 916,471 912,486" fill="#475569"/>
  <line x1="930" y1="540" x2="770" y2="625" stroke="#475569" stroke-width="3"/><polygon points="770,625 785,625 778,612" fill="#475569"/>
  <rect class="box" x="220" y="755" width="960" height="65" rx="12" fill="#f5f5f5" stroke="#666666"/><text class="heading" x="700" y="795" text-anchor="middle">Mutation and Broadcast share one mutex; waiters recheck their predicate.</text>
</svg>
