<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title description">
  <title id="title">Chapter 9 Feature 17: Store UPDATE command data</title>
  <desc id="description">ModifyData groups the target table and field, a new-value query expression, and a selection predicate. Read-only accessors expose the values, and the zero value remains safe.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .title{font:700 25px sans-serif;fill:#1f2937}.box{stroke-width:2;rx:18;ry:18}.label{font:17px sans-serif;fill:#1f2937;text-anchor:middle}.small{font:15px sans-serif;fill:#475569;text-anchor:middle}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1160" height="520" fill="#fff"/>
  <text class="title" x="580" y="62" text-anchor="middle">Chapter 9 / Feature 17: Store UPDATE command data</text>
  <rect class="box" x="45" y="195" width="235" height="135" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="label" x="162" y="238"><tspan x="162">Update target</tspan><tspan class="small" x="162" dy="30">table: student</tspan><tspan class="small" x="162" dy="24">field: score</tspan></text>
  <rect class="box" x="340" y="195" width="260" height="135" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="470" y="238"><tspan x="470">New value expression</tspan><tspan class="small" x="470" dy="30">grade + literal or field</tspan><tspan class="small" x="470" dy="24">query.Expression</tspan></text>
  <rect class="box" x="340" y="365" width="260" height="105" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="470" y="404"><tspan x="470">Selection predicate</tspan><tspan class="small" x="470" dy="27">active = 1</tspan><tspan class="small" x="470" dy="22">query.Predicate</tspan></text>
  <rect class="box" x="680" y="250" width="220" height="120" fill="#d5e8d4" stroke="#82b366"/>
  <text class="label" x="790" y="293"><tspan x="790">ModifyData</tspan><tspan class="small" x="790" dy="30">private command fields</tspan></text>
  <rect class="box" x="970" y="240" width="185" height="140" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="label" x="1062" y="278"><tspan x="1062">Read-only accessors</tspan><tspan class="small" x="1062" dy="27">TableName()</tspan><tspan class="small" x="1062" dy="22">TargetField()</tspan><tspan class="small" x="1062" dy="22">NewValue() · Predicate()</tspan></text>
  <rect class="box" x="680" y="405" width="220" height="85" fill="#f5f5f5" stroke="#666"/>
  <text class="label" x="790" y="438"><tspan x="790">Zero value</tspan><tspan class="small" x="790" dy="24">safe empty values</tspan></text>
  <path class="edge" d="M280 260 L670 290"/><path class="edge" d="M600 260 L670 300"/><path class="edge" d="M600 415 H650 V340 H670"/>
  <path class="edge" d="M900 310 H960"/><path class="edge" d="M790 370 V395"/>
</svg>
