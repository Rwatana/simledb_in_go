<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 16: Replace dirty buffer</title><desc id="description">dirty Bufferをrecovery log、old data Pageの順にflushしてからtarget blockへ置き換える。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/><text class="title" x="700" y="60" text-anchor="middle">Chapter 4 / Feature 16: Replace dirty buffer</text>
  <rect class="box" x="25" y="175" width="240" height="180" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="145" y="218" text-anchor="middle">Dirty old frame</text><text class="text" x="145" y="270" text-anchor="middle">assigned · pin count 0</text><text class="text" x="145" y="315" text-anchor="middle">transaction + optional LSN</text>
  <rect class="box" x="300" y="175" width="240" height="180" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="420" y="218" text-anchor="middle">Flush recovery log</text><text class="text" x="420" y="290" text-anchor="middle">only when LSN exists</text>
  <rect class="box" x="575" y="175" width="240" height="180" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="695" y="218" text-anchor="middle">Write old data Page</text><text class="text" x="695" y="290" text-anchor="middle">then clear dirty metadata</text>
  <rect class="box" x="850" y="175" width="240" height="180" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="970" y="218" text-anchor="middle">Read target block</text><text class="text" x="970" y="290" text-anchor="middle">into temporary Page</text>
  <rect class="box" x="1125" y="175" width="240" height="180" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="1245" y="218" text-anchor="middle">Commit replacement</text><text class="text" x="1245" y="270" text-anchor="middle">BlockID + Contents</text><text class="text" x="1245" y="315" text-anchor="middle">clean · pin count 0</text>
  <line x1="265" y1="265" x2="300" y2="265" stroke="#475569" stroke-width="3"/><polygon points="300,265 287,257 287,273" fill="#475569"/><line x1="540" y1="265" x2="575" y2="265" stroke="#475569" stroke-width="3"/><polygon points="575,265 562,257 562,273" fill="#475569"/><line x1="815" y1="265" x2="850" y2="265" stroke="#475569" stroke-width="3"/><polygon points="850,265 837,257 837,273" fill="#475569"/><line x1="1090" y1="265" x2="1125" y2="265" stroke="#475569" stroke-width="3"/><polygon points="1125,265 1112,257 1112,273" fill="#475569"/>
  <rect class="box" x="150" y="470" width="520" height="105" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="410" y="510" text-anchor="middle">Log or data write error</text><text class="text" x="410" y="550" text-anchor="middle">Keep the old frame dirty for retry</text>
  <rect class="box" x="730" y="470" width="520" height="105" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="990" y="510" text-anchor="middle">Target read error after flush</text><text class="text" x="990" y="550" text-anchor="middle">Keep the old frame clean and durable</text>
  <rect class="box" x="220" y="655" width="960" height="90" rx="12" fill="#e3f2fd" stroke="#6c8ebf"/><text class="heading" x="700" y="690" text-anchor="middle">Publish the target BlockID only after the old Page is durable</text><text class="text" x="700" y="720" text-anchor="middle">and the target Page has been fully read.</text>
</svg>
