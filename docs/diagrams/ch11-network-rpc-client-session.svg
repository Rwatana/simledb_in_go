<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Connect, complete, and close a remote client session</title>
  <desc id="description">ConnectRPCSession sends one SimpleDB.Connect request through the caller-owned rpc.Client and retains the returned transaction ID. RemoteSession.Commit and RemoteSession.Rollback send their matching RPC calls; a successful response replaces the ID with the successor, while an error preserves the previous ID. Close clears the ID and marks the local session closed only after a successful reply; the caller-owned client and transport remain open.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/><text class="title" x="600" y="52" text-anchor="middle">Chapter 11 / Connect, complete, and close a remote client session</text>
  <rect class="box" x="55" y="165" width="230" height="100" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="170" y="205" text-anchor="middle">Caller</text><text class="small" x="170" y="235" text-anchor="middle">owns rpc.Client</text>
  <rect class="box" x="355" y="165" width="250" height="100" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text class="label" x="480" y="205" text-anchor="middle">ConnectRPCSession</text><text class="small" x="480" y="235" text-anchor="middle">one Connect request</text>
  <rect class="box" x="675" y="165" width="275" height="100" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="812" y="200" text-anchor="middle">DriverService</text><text class="small" x="812" y="232" text-anchor="middle">Connect, Commit, Rollback, Close</text>
  <rect class="box" x="1010" y="165" width="165" height="100" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="1092" y="205" text-anchor="middle">START record</text><text class="small" x="1092" y="235" text-anchor="middle">initial / next ID</text>
  <rect class="box" x="370" y="405" width="430" height="95" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="585" y="444" text-anchor="middle">RemoteSession</text><text class="small" x="585" y="475" text-anchor="middle">Commit/Rollback replace ID; Close clears it</text>
  <rect class="box" x="120" y="405" width="220" height="95" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="label" x="230" y="444" text-anchor="middle">Error behavior</text><text class="small" x="230" y="475" text-anchor="middle">RPC failure keeps ID; failed Close can retry</text>
  <rect class="box" x="260" y="570" width="680" height="75" rx="14" fill="#f3f4f6" stroke="#6b7280"/><text class="label" x="600" y="601" text-anchor="middle">Caller keeps the rpc.Client and transport</text><text class="small" x="600" y="627" text-anchor="middle">session methods do not close either resource</text>
  <path class="line" d="M285 215 H355"/><path class="line" d="M605 215 H675"/><path class="line" d="M950 215 H1010"/><path class="line" d="M1092 265 V350 H800 V405"/><path class="line" d="M355 250 H340 V405"/><path class="line" d="M170 265 V520 H420 V570"/><path class="line" d="M800 450 H980 V300 H812 V265"/><path class="line" d="M720 265 V345 H585 V405"/>
  <text class="small" x="320" y="200" text-anchor="middle">client</text><text class="small" x="640" y="200" text-anchor="middle">SimpleDB.Connect</text><text class="small" x="982" y="200" text-anchor="middle">initial transaction</text><text class="small" x="910" y="340" text-anchor="middle">initial ID</text><text class="small" x="892" y="430" text-anchor="middle">Commit / Rollback / Close RPC</text><text class="small" x="650" y="340" text-anchor="middle">successor ID or Close success</text>
</svg>
