<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 19: Choose unpinned buffer candidate</title><desc id="description">pool順でpinned frameをskipし、最初のunpinned frameをstate変更なしで返す。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/><text class="title" x="700" y="60" text-anchor="middle">Chapter 4 / Feature 19: Choose unpinned candidate</text>
  <rect class="box" x="70" y="230" width="280" height="170" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="210" y="275" text-anchor="middle">Scan pool order</text><text class="text" x="210" y="340" text-anchor="middle">Frame 0 → Frame N-1</text>
  <rect class="box" x="500" y="130" width="300" height="160" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="650" y="180" text-anchor="middle">Frame is pinned</text><text class="text" x="650" y="240" text-anchor="middle">skip without mutation</text>
  <rect class="box" x="500" y="360" width="300" height="190" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="650" y="410" text-anchor="middle">Frame is unpinned</text><text class="text" x="650" y="465" text-anchor="middle">return first candidate</text><text class="text" x="650" y="510" text-anchor="middle">assigned/dirty is allowed</text>
  <rect class="box" x="1010" y="225" width="300" height="170" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="1160" y="275" text-anchor="middle">All frames pinned</text><text class="text" x="1160" y="340" text-anchor="middle">return nil, false</text>
  <line x1="350" y1="280" x2="500" y2="210" stroke="#475569" stroke-width="3"/><polygon points="500,210 486,208 492,220" fill="#475569"/><line x1="350" y1="350" x2="500" y2="455" stroke="#475569" stroke-width="3"/><polygon points="500,455 488,444 482,457" fill="#475569"/><line x1="800" y1="210" x2="1010" y2="310" stroke="#475569" stroke-width="3"/><polygon points="1010,310 998,299 992,312" fill="#475569"/>
  <rect class="box" x="230" y="670" width="940" height="90" rx="12" fill="#e3f2fd" stroke="#6c8ebf"/><text class="heading" x="700" y="708" text-anchor="middle">Selection changes no frame or pool state</text><text class="text" x="700" y="738" text-anchor="middle">and holds the Manager mutex for the complete scan.</text>
</svg>
