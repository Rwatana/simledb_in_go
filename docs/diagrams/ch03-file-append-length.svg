<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 3 Feature 4: FileManager append and length</title>
  <desc id="description">2 blockのfileへzero-filled block 2を追加し、logical lengthが3へ変わる状態遷移と、partial blockをerrorにする規則。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.small{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#4b5563}.box{stroke-width:2}</style>
  </defs>
  <rect width="1400" height="850" fill="#ffffff"/>
  <text class="title" x="700" y="55" text-anchor="middle">Chapter 3 / Feature 4: FileManager append / length</text>

  <rect class="box" x="80" y="155" width="470" height="250" rx="12" fill="#f8fafc" stroke="#475569"/>
  <text class="heading" x="315" y="198" text-anchor="middle">Before append: Length = 2 blocks</text>
  <rect class="box" x="105" y="245" width="200" height="90" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="205" y="280" text-anchor="middle">block 0</text><text class="text" x="205" y="312" text-anchor="middle">existing data</text>
  <rect class="box" x="305" y="245" width="200" height="90" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="405" y="280" text-anchor="middle">block 1</text><text class="text" x="405" y="312" text-anchor="middle">existing data</text>

  <rect class="box" x="590" y="165" width="300" height="220" rx="12" fill="#fff2cc" stroke="#d6b656"/>
  <text class="heading" x="740" y="207" text-anchor="middle">Append("student.tbl")</text><text class="text" x="740" y="260" text-anchor="middle">new block number</text><text class="heading" x="740" y="292" text-anchor="middle">= current length = 2</text><text class="small" x="740" y="340" text-anchor="middle">WriteAt(offset 2 × block size)</text>
  <line x1="550" y1="275" x2="590" y2="275" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box" x="930" y="125" width="400" height="310" rx="12" fill="#f8fafc" stroke="#475569"/>
  <text class="heading" x="1130" y="168" text-anchor="middle">After append: Length = 3 blocks</text>
  <rect class="box" x="955" y="190" width="350" height="60" fill="#dae8fc" stroke="#6c8ebf"/><text class="text" x="1130" y="215" text-anchor="middle">block 0</text><text class="small" x="1130" y="238" text-anchor="middle">unchanged</text>
  <rect class="box" x="955" y="250" width="350" height="60" fill="#dae8fc" stroke="#6c8ebf"/><text class="text" x="1130" y="275" text-anchor="middle">block 1</text><text class="small" x="1130" y="298" text-anchor="middle">unchanged</text>
  <rect x="955" y="310" width="350" height="60" fill="#d5e8d4" stroke="#82b366" stroke-width="4"/><text class="heading" x="1130" y="335" text-anchor="middle">block 2</text><text class="small" x="1130" y="358" text-anchor="middle">zero-filled</text>
  <line x1="890" y1="275" x2="930" y2="275" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box" x="355" y="555" width="690" height="130" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="heading" x="700" y="606" text-anchor="middle">Length(file) = file byte size ÷ block size</text><text class="text" x="700" y="650" text-anchor="middle">partial block → error (no silent truncation)</text>

  <rect class="box" x="220" y="745" width="960" height="65" rx="12" fill="#f8cecc" stroke="#b85450"/>
  <text class="heading" x="700" y="785" text-anchor="middle">Append and Length share the Manager mutex to keep size and block number consistent.</text>
</svg>
