<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 11 Feature 36: Open a B-tree page</title>
  <desc id="desc">NewPage validates its transaction, block, and layout, pins the block once, and retains the dependencies. A pin failure returns no page and preserves the cause.</desc>
  <style>.title{font-family:Arial,sans-serif;font-size:28px;font-weight:700;fill:#1f2937}.head{font-family:Arial,sans-serif;font-size:21px;font-weight:700;fill:#1f2937}.body{font-family:Arial,sans-serif;font-size:18px;fill:#1f2937}</style>
  <rect width="1200" height="680" fill="#fff"/>
  <text class="title" x="600" y="78" text-anchor="middle">Chapter 11 / Feature 36: Open a B-tree page</text>
  <rect x="80" y="250" width="250" height="150" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text class="head" x="205" y="290" text-anchor="middle">Caller</text>
  <text class="body" x="205" y="330" text-anchor="middle">transaction · block ID</text>
  <text class="body" x="205" y="365" text-anchor="middle">record layout</text>
  <rect x="470" y="230" width="300" height="190" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text class="head" x="620" y="278" text-anchor="middle">btree.NewPage</text>
  <text class="body" x="620" y="325" text-anchor="middle">validate · pin once</text>
  <text class="body" x="620" y="365" text-anchor="middle">retain dependencies</text>
  <rect x="900" y="250" width="220" height="150" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text class="head" x="1010" y="302" text-anchor="middle">Transaction</text>
  <text class="body" x="1010" y="350" text-anchor="middle">Pin(block)</text>
  <rect x="460" y="500" width="320" height="110" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text class="head" x="620" y="545" text-anchor="middle">Success</text>
  <text class="body" x="620" y="582" text-anchor="middle">pinned block + retained layout</text>
  <rect x="830" y="500" width="300" height="110" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text class="head" x="980" y="545" text-anchor="middle">Failure</text>
  <text class="body" x="980" y="582" text-anchor="middle">no page · cause preserved</text>
  <path d="M330 325H470 M770 325H900 M620 420V500 M770 355L830 500" fill="none" stroke="#475569" stroke-width="3"/>
  <polygon points="470,325 455,317 455,333" fill="#475569"/>
  <polygon points="900,325 885,317 885,333" fill="#475569"/>
  <polygon points="620,500 612,485 628,485" fill="#475569"/>
  <polygon points="830,500 817,488 833,482" fill="#475569"/>
</svg>
