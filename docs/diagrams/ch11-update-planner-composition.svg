<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Compose the update planner with server metadata</title>
  <desc id="description">A successful server manager set contains a metadata facade and a BasicUpdatePlanner constructed with that facade. The caller supplies a CREATE TABLE command and active transaction, and the update planner writes the table schema through shared metadata without taking transaction ownership. Update strategy selection remains separate.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 17px system-ui,sans-serif;fill:#111827}.small{font:14px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.boundary{fill:#faf5ff;stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 5}
    </style>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text class="title" x="500" y="48" text-anchor="middle">Chapter 11 / Compose the update planner with server metadata</text>
  <rect class="boundary" x="30" y="120" width="540" height="300" rx="20"/>
  <text class="label" x="300" y="158" text-anchor="middle">Successful server manager set</text>
  <rect class="box" x="70" y="235" width="190" height="110" rx="14" fill="#fce7f3" stroke="#db2777"/>
  <text class="label" x="165" y="275" text-anchor="middle">Metadata facade</text>
  <text class="small" x="165" y="307" text-anchor="middle">table · view · index catalogs</text>
  <rect class="box" x="335" y="225" width="195" height="130" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="432" y="266" text-anchor="middle">BasicUpdatePlanner</text>
  <text class="small" x="432" y="298" text-anchor="middle">implements UpdatePlanner</text>
  <text class="small" x="432" y="326" text-anchor="middle">uses shared metadata</text>
  <path class="line" d="M260 290 H335"/>
  <text class="small" x="298" y="276" text-anchor="middle">constructor dependency</text>
  <rect class="box" x="650" y="145" width="300" height="100" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="800" y="183" text-anchor="middle">Application caller</text>
  <text class="small" x="800" y="214" text-anchor="middle">CREATE TABLE + active transaction</text>
  <rect class="box" x="650" y="300" width="300" height="100" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="800" y="340" text-anchor="middle">Catalog schema registered</text>
  <text class="small" x="800" y="370" text-anchor="middle">transaction remains caller-owned</text>
  <path class="line" d="M650 195 H610 V260 H530"/>
  <text class="small" x="612" y="247" text-anchor="middle">ExecuteCreateTable(command, tx)</text>
  <path class="line" d="M335 320 H300 V365 H260"/>
  <text class="small" x="298" y="354" text-anchor="middle">write table metadata</text>
  <path class="line" d="M530 320 H590 V350 H650"/>
  <text class="small" x="590" y="337" text-anchor="middle">returns success</text>
  <text class="small" x="500" y="468" text-anchor="middle">Update planner strategy selection and SQL command dispatch remain separate behaviors.</text>
</svg>
