<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Return typed SELECT rows over RPC</title>
  <desc id="description">ExecuteQuery sends a SELECT statement to the RPC service, plans it with the active session transaction, opens and materializes the scan as ordered column metadata and typed rows, then closes the scan on every path. Read and close failures return no partial rows; transaction completion remains explicit.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/><text class="title" x="600" y="52" text-anchor="middle">Chapter 11 / Return typed SELECT rows over RPC</text>
  <rect class="box" x="35" y="145" width="225" height="100" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="147" y="185" text-anchor="middle">RPC client</text><text class="small" x="147" y="218" text-anchor="middle">ExecuteQueryRequest</text>
  <rect class="box" x="325" y="145" width="225" height="100" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text class="label" x="437" y="185" text-anchor="middle">DriverService</text><text class="small" x="437" y="218" text-anchor="middle">active transaction</text>
  <rect class="box" x="625" y="145" width="245" height="100" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="747" y="181" text-anchor="middle">Managers.CreateQueryPlan</text><text class="small" x="747" y="214" text-anchor="middle">parse and plan SELECT</text>
  <rect class="box" x="945" y="145" width="220" height="100" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="1055" y="185" text-anchor="middle">Query plan</text><text class="small" x="1055" y="218" text-anchor="middle">open scan</text>
  <rect class="box" x="430" y="375" width="340" height="105" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="600" y="418" text-anchor="middle">ExecuteQueryResponse</text><text class="small" x="600" y="450" text-anchor="middle">ordered columns + typed rows</text>
  <rect class="box" x="780" y="365" width="365" height="95" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="label" x="962" y="401" text-anchor="middle">Always close an opened scan</text><text class="small" x="962" y="431" text-anchor="middle">read or close error means no partial rows</text>
  <rect class="box" x="260" y="590" width="680" height="85" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="600" y="624" text-anchor="middle">Session transaction remains active</text><text class="small" x="600" y="651" text-anchor="middle">caller chooses Commit, Rollback, or Close</text>
  <path class="line" d="M260 195 H325"/><path class="line" d="M550 195 H625"/><path class="line" d="M870 195 H945"/><path class="line" d="M1055 245 V310 H770 V375"/><path class="line" d="M437 245 V520 H600 V590"/><path class="line" d="M1055 245 V300 H962 V365"/>
  <text class="small" x="292" y="180" text-anchor="middle">SQL</text><text class="small" x="587" y="180" text-anchor="middle">same transaction</text><text class="small" x="907" y="180" text-anchor="middle">plan</text><text class="small" x="840" y="302" text-anchor="middle">schema order</text>
</svg>
