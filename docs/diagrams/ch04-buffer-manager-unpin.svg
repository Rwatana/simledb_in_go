<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 21: Unpin a managed buffer</title><desc id="description">Manager所有frameをunpinし、1から0の遷移時だけavailable countを増やす。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/><text class="title" x="700" y="60" text-anchor="middle">Chapter 4 / Feature 21: Unpin a managed buffer</text>
  <rect class="box" x="70" y="225" width="280" height="170" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="210" y="270" text-anchor="middle">Validate Manager ownership</text><text class="text" x="210" y="335" text-anchor="middle">under Manager mutex</text>
  <rect class="box" x="515" y="115" width="300" height="210" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="665" y="160" text-anchor="middle">Managed frame · pin count &gt; 1</text><text class="text" x="665" y="220" text-anchor="middle">unpin → count − 1</text><text class="text" x="665" y="270" text-anchor="middle">Available unchanged</text>
  <rect class="box" x="515" y="385" width="300" height="210" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="665" y="430" text-anchor="middle">Managed frame · pin count 1</text><text class="text" x="665" y="490" text-anchor="middle">unpin → count 0</text><text class="text" x="665" y="540" text-anchor="middle">Available + 1</text>
  <rect class="box" x="1040" y="225" width="300" height="180" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="1190" y="270" text-anchor="middle">nil, foreign, or count 0</text><text class="text" x="1190" y="325" text-anchor="middle">return error</text><text class="text" x="1190" y="365" text-anchor="middle">no state change</text>
  <line x1="350" y1="270" x2="515" y2="220" stroke="#475569" stroke-width="3"/><polygon points="515,220 501,217 506,231" fill="#475569"/><line x1="350" y1="350" x2="515" y2="490" stroke="#475569" stroke-width="3"/><polygon points="515,490 503,478 497,492" fill="#475569"/><line x1="350" y1="310" x2="1040" y2="315" stroke="#475569" stroke-width="3"/><polygon points="1040,315 1027,307 1027,323" fill="#475569"/>
  <rect class="box" x="220" y="685" width="960" height="85" rx="12" fill="#f5f5f5" stroke="#666666"/><text class="heading" x="700" y="720" text-anchor="middle">Every valid release is counted; availability changes only once.</text><text class="text" x="700" y="750" text-anchor="middle">The Manager mutex protects ownership, pin count, and accounting together.</text>
</svg>
