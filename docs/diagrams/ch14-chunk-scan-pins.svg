<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Chunk scan page lifetime</title>
  <desc id="desc">Validate an inclusive block range, pin each record page in ascending order, release prior pages after construction failure, and retry unsuccessful unpins when closing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52677d"/></marker>
    <style>
      text { font: 16px sans-serif; fill: #172b4d; text-anchor: middle; }
      .small { font-size: 13px; }
      .input { fill: #dae8fc; stroke: #6c8ebf; }
      .step { fill: #fff2cc; stroke: #d6b656; }
      .work { fill: #d5e8d4; stroke: #82b366; }
      .failure { fill: #f8cecc; stroke: #b85450; }
      .edge { fill: none; stroke: #52677d; stroke-width: 2; marker-end: url(#arrow); }
      .box { stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1000" height="420" fill="#fff"/>
  <rect class="input box" x="35" y="120" width="190" height="82"/>
  <text x="130" y="150">Input</text><text class="small" x="130" y="176">file, layout, block range</text>
  <rect class="step box" x="280" y="120" width="195" height="82"/>
  <text x="377" y="150">Validate</text><text class="small" x="377" y="176">file and inclusive range</text>
  <rect class="work box" x="535" y="120" width="190" height="82"/>
  <text x="630" y="150">Pin each block</text><text class="small" x="630" y="176">ascending order</text>
  <rect class="work box" x="785" y="120" width="180" height="82"/>
  <text x="875" y="150">ChunkScan owns</text><text class="small" x="875" y="176">all page handles</text>
  <rect class="failure box" x="430" y="285" width="190" height="72"/>
  <text x="525" y="315">Pin failure</text><text class="small" x="525" y="339">release earlier pages</text>
  <rect class="step box" x="735" y="285" width="210" height="72"/>
  <text x="840" y="315">Close</text><text class="small" x="840" y="339">unpin; retain failures</text>
  <path class="edge" d="M225 161 H280"/>
  <path class="edge" d="M475 161 H535"/>
  <path class="edge" d="M725 161 H785"/>
  <path class="edge" d="M630 202 V245 H525 V285"/>
  <text class="small" x="570" y="238">failure</text>
  <path class="edge" d="M875 202 V285"/>
  <path class="edge" d="M620 321 H735"/>
  <text class="small" x="677" y="313">retry failed releases</text>
</svg>
