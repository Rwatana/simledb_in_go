<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Chapter 9 Feature 9: Parse an equality term</title>
  <desc id="description">Parser.ParseTerm parses a left expression, consumes an equals delimiter, parses a right expression, and builds a query term while preserving following input. Errors retain byte offsets and prior sequential token consumption.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .title{font:700 25px sans-serif;fill:#1f2937}.box{stroke-width:2;rx:18;ry:18}.label{font:17px sans-serif;fill:#1f2937;text-anchor:middle}.small{font:15px sans-serif;fill:#475569;text-anchor:middle}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fff"/>
  <text class="title" x="600" y="60" text-anchor="middle">Chapter 9 / Feature 9: Parse an equality term</text>
  <rect class="box" x="25" y="215" width="220" height="125" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="label" x="135" y="258"><tspan x="135">SQL input</tspan><tspan class="small" x="135" dy="30">Customer = 42, next</tspan></text>
  <rect class="box" x="290" y="210" width="190" height="130" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="385" y="255"><tspan x="385">ParseExpression()</tspan><tspan class="small" x="385" dy="30">left side</tspan></text>
  <rect class="box" x="520" y="210" width="190" height="130" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="615" y="276">EatDelimiter('=')</text>
  <rect class="box" x="750" y="210" width="190" height="130" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="845" y="255"><tspan x="845">ParseExpression()</tspan><tspan class="small" x="845" dy="30">right side</tspan></text>
  <rect class="box" x="980" y="210" width="195" height="130" fill="#d5e8d4" stroke="#82b366"/>
  <text class="label" x="1077" y="255"><tspan x="1077">query.NewTerm</tspan><tspan class="small" x="1077" dy="30">next token remains</tspan></text>
  <rect class="box" x="410" y="410" width="390" height="105" fill="#f8cecc" stroke="#b85450"/>
  <text class="small" x="605" y="440"><tspan x="605">left, equals, or right parse error</tspan><tspan x="605" dy="24">byte-positioned context</tspan><tspan x="605" dy="24">prior consumption is retained</tspan></text>
  <path class="edge" d="M245 277 H280"/><text class="small" x="263" y="261">input</text>
  <path class="edge" d="M480 275 H510"/>
  <path class="edge" d="M710 275 H740"/>
  <path class="edge" d="M940 275 H970"/>
  <path class="edge" d="M615 340 V400"/><text class="small" x="660" y="378">failure</text>
</svg>
