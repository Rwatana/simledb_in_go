<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Embedded connection transaction lifecycle</title>
  <desc id="description">A Go application opens an embedded Connection implementing driver.Conn. Begin asks server Managers for a transaction and returns a driver.Tx adapter. The adapter delegates Commit or Rollback to the underlying transaction. Prepare reports driver.ErrSkip. Closing the connection blocks new operations but leaves returned transactions caller-owned.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#6b7280;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text class="title" x="600" y="50" text-anchor="middle">Chapter 11 / Embedded connection transaction lifecycle</text>
  <rect class="box" x="35" y="215" width="220" height="95" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="145" y="252" text-anchor="middle">Go application</text>
  <text class="small" x="145" y="281" text-anchor="middle">database/sql/driver</text>
  <rect class="box" x="350" y="200" width="255" height="105" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="477" y="242" text-anchor="middle">embedded.Connection</text>
  <text class="small" x="477" y="273" text-anchor="middle">implements driver.Conn</text>
  <rect class="box" x="350" y="440" width="255" height="95" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="477" y="478" text-anchor="middle">server.Managers</text>
  <text class="small" x="477" y="507" text-anchor="middle">shared manager set</text>
  <rect class="box" x="770" y="200" width="250" height="105" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="895" y="242" text-anchor="middle">transactionAdapter</text>
  <text class="small" x="895" y="273" text-anchor="middle">implements driver.Tx</text>
  <rect class="box" x="770" y="440" width="250" height="95" rx="14" fill="#fce7f3" stroke="#db2777"/>
  <text class="label" x="895" y="478" text-anchor="middle">transaction.Transaction</text>
  <text class="small" x="895" y="507" text-anchor="middle">durable Commit or Rollback</text>
  <rect class="box" x="35" y="390" width="220" height="85" rx="14" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="label" x="145" y="425" text-anchor="middle">Prepare</text>
  <text class="small" x="145" y="453" text-anchor="middle">driver.ErrSkip for now</text>
  <path class="line" d="M255 262 H350"/><text class="small" x="302" y="247" text-anchor="middle">open</text>
  <path class="line" d="M477 305 V440"/><text class="small" x="535" y="380">Begin / NewTransaction</text>
  <path class="line" d="M605 488 H680 V252 H770"/><text class="small" x="680" y="398" text-anchor="middle" transform="rotate(-90 680 398)">returns driver.Tx</text>
  <path class="line" d="M895 305 V440"/><text class="small" x="950" y="380">Commit / Rollback</text>
  <path class="dashed" d="M350 283 H310 V432 H255"/><text class="small" x="302" y="370" text-anchor="middle">unsupported statement</text>
  <text class="small" x="600" y="600" text-anchor="middle">Close blocks new operations; each returned transaction stays caller-owned until Commit or Rollback.</text>
</svg>
