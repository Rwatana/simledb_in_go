<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Select a B-tree directory child</title>
  <desc id="desc">A lower-bound search chooses the first exact matching directory entry, otherwise its predecessor; keys below the minimum entry are rejected.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569" />
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .box { stroke-width: 2; rx: 12; }
      .directory { fill: #dae8fc; stroke: #6c8ebf; }
      .rule { fill: #fff2cc; stroke: #d6b656; }
      .exact { fill: #d5e8d4; stroke: #82b366; }
      .predecessor { fill: #e1d5e7; stroke: #9673a6; }
      .below { fill: #f8cecc; stroke: #b85450; }
      .label { font-size: 18px; font-weight: 600; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text class="title" x="600" y="58" text-anchor="middle">Chapter 11 / Feature 56: Select a B-tree directory child</text>
  <rect class="box directory" x="95" y="105" width="1010" height="100" />
  <text class="label" x="600" y="143" text-anchor="middle">
    <tspan x="600">Directory page · sorted entries</tspan>
    <tspan x="600" dy="30">slot 0: 10 → block 100 | slot 1: 20 → block 200 | slot 2: 20 → block 201 | slot 3: 40 → block 400</tspan>
  </text>
  <rect class="box rule" x="340" y="250" width="520" height="70" />
  <text class="label" x="600" y="292" text-anchor="middle">Find the first key ≥ searchKey (lower bound)</text>
  <rect class="box exact" x="80" y="430" width="330" height="110" />
  <text class="label" x="245" y="465" text-anchor="middle">
    <tspan x="245">searchKey = 20</tspan>
    <tspan x="245" dy="26">First exact match is slot 1</tspan>
    <tspan x="245" dy="26">Return directory.idx block 200</tspan>
  </text>
  <rect class="box predecessor" x="435" y="430" width="415" height="110" />
  <text class="label" x="642" y="465" text-anchor="middle">
    <tspan x="642">searchKey = 31</tspan>
    <tspan x="642" dy="26">No exact match; predecessor is slot 2 (key 20)</tspan>
    <tspan x="642" dy="26">Return directory.idx block 201</tspan>
  </text>
  <rect class="box below" x="875" y="430" width="270" height="110" />
  <text class="label" x="1010" y="465" text-anchor="middle">
    <tspan x="1010">searchKey = 9</tspan>
    <tspan x="1010" dy="26">No predecessor before slot 0</tspan>
    <tspan x="1010" dy="26">Reject: minimum-key entry is required</tspan>
  </text>
  <path class="arrow" d="M600 207 V242" />
  <path class="arrow" d="M460 320 C380 365 245 370 245 422" />
  <path class="arrow" d="M600 320 V422" />
  <path class="arrow" d="M740 320 C820 365 1010 370 1010 422" />
</svg>
