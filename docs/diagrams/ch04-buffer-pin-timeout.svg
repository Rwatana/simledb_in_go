<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 26: Abort after the pin deadline</title><desc id="description">Pinがunavailableならdeadline timerを開始し、releaseなら成功、期限後もunavailableならErrPinTimeoutを返す。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/><text class="title" x="700" y="58" text-anchor="middle">Chapter 4 / Feature 26: Abort after the pin deadline</text>
  <rect class="box" x="70" y="245" width="300" height="185" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="220" y="290" text-anchor="middle">Pin attempt unavailable</text><text class="text" x="220" y="345" text-anchor="middle">start one deadline timer</text><text class="text" x="220" y="390" text-anchor="middle">default: 10 seconds</text>
  <rect class="box" x="505" y="245" width="280" height="170" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="645" y="290" text-anchor="middle">Cond.Wait()</text><text class="text" x="645" y="355" text-anchor="middle">Manager mutex released</text>
  <rect class="box" x="1030" y="105" width="310" height="190" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="1185" y="150" text-anchor="middle">Final release before deadline</text><text class="text" x="1185" y="205" text-anchor="middle">Broadcast → retry</text><text class="text" x="1185" y="250" text-anchor="middle">return pinned frame</text>
  <rect class="box" x="1030" y="385" width="310" height="190" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="1185" y="430" text-anchor="middle">Deadline fires</text><text class="text" x="1185" y="485" text-anchor="middle">Broadcast → retry</text><text class="text" x="1185" y="530" text-anchor="middle">still unavailable</text>
  <rect class="box" x="505" y="570" width="280" height="165" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="645" y="615" text-anchor="middle">return nil</text><text class="text" x="645" y="660" text-anchor="middle">ErrPinTimeout</text><text class="text" x="645" y="700" text-anchor="middle">state unchanged</text>
  <line x1="370" y1="337" x2="505" y2="337" stroke="#475569" stroke-width="3"/><polygon points="505,337 491,329 491,345" fill="#475569"/>
  <line x1="785" y1="285" x2="1030" y2="200" stroke="#475569" stroke-width="3"/><polygon points="1030,200 1015,196 1020,211" fill="#475569"/>
  <line x1="785" y1="365" x2="1030" y2="480" stroke="#475569" stroke-width="3"/><polygon points="1030,480 1023,466 1015,480" fill="#475569"/>
  <line x1="1030" y1="540" x2="785" y2="650" stroke="#475569" stroke-width="3"/><polygon points="785,650 800,650 793,636" fill="#475569"/>
  <rect class="box" x="220" y="765" width="960" height="55" rx="12" fill="#f5f5f5" stroke="#666666"/><text class="heading" x="700" y="800" text-anchor="middle">Timer wakes the loop; retry under the mutex decides success or timeout.</text>
</svg>
