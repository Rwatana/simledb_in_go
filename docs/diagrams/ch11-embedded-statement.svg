<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Embedded statement preparation</title>
  <desc id="description">An application passes SQL text to embedded.Connection.Prepare. The resulting driver.Stmt retains that exact text and the connection without parsing. NumInput returns unknown, Close is idempotent, and execution methods report driver.ErrSkip until execution is implemented separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.blue{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrow)}.muted{fill:none;stroke:#6b7280;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="620" fill="#fff"/>
  <text class="title" x="550" y="50" text-anchor="middle">Chapter 11 / Embedded statement preparation</text>
  <rect class="box" x="45" y="190" width="220" height="95" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="155" y="229" text-anchor="middle">Go application</text>
  <text class="small" x="155" y="258" text-anchor="middle">Prepare(query)</text>
  <rect class="box" x="355" y="185" width="240" height="105" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="475" y="228" text-anchor="middle">embedded.Connection</text>
  <text class="small" x="475" y="258" text-anchor="middle">driver.Conn</text>
  <rect class="box" x="730" y="180" width="275" height="115" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="867" y="219" text-anchor="middle">embedded.statement</text>
  <text class="small" x="867" y="247" text-anchor="middle">driver.Stmt</text>
  <text class="small" x="867" y="272" text-anchor="middle">retains query and connection</text>
  <rect class="box" x="355" y="425" width="240" height="85" rx="14" fill="#dbeafe" stroke="#2563eb"/>
  <text class="label" x="475" y="460" text-anchor="middle">NumInput = -1</text>
  <text class="small" x="475" y="487" text-anchor="middle">unknown until parsing</text>
  <rect class="box" x="730" y="425" width="275" height="85" rx="14" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="label" x="867" y="460" text-anchor="middle">Stmt.Exec / Stmt.Query</text>
  <text class="small" x="867" y="487" text-anchor="middle">driver.ErrSkip for now</text>
  <path class="line" d="M265 237 H355"/><text class="small" x="310" y="222" text-anchor="middle">SQL</text>
  <path class="line" d="M595 237 H730"/><text class="small" x="662" y="222" text-anchor="middle">creates handle</text>
  <path class="blue" d="M820 295 V360 H475 V425"/><text class="small" x="620" y="350" text-anchor="middle">parameter arity</text>
  <path class="muted" d="M914 295 V425"/><text class="small" x="955" y="360">later</text>
  <text class="small" x="550" y="580" text-anchor="middle">Close is idempotent; parsing, execution, rows, and metadata remain separate behaviors.</text>
</svg>
