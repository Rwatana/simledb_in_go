<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Embedded prepared statement SELECT rows</title>
  <desc id="description">A Go application prepares and queries through an embedded connection. QueryContext rejects cancellation before planning. The prepared statement opens a query plan with the active caller-owned transaction and returns projected values, database type names, and Go scan types through driver.Rows.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.blue{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrow)}.purple{fill:none;stroke:#7c3aed;stroke-width:2;marker-end:url(#arrow)}.green{fill:none;stroke:#16a34a;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="680" fill="#fff"/>
  <text class="title" x="550" y="50" text-anchor="middle">Chapter 11 / Prepared statement SELECT rows</text>
  <rect class="box" x="35" y="185" width="215" height="95" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="142" y="224" text-anchor="middle">Go application</text>
  <text class="small" x="142" y="253" text-anchor="middle">Prepare + Query</text>
  <rect class="box" x="330" y="180" width="245" height="105" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="452" y="222" text-anchor="middle">embedded.Connection</text>
  <text class="small" x="452" y="252" text-anchor="middle">driver.Conn</text>
  <rect class="box" x="700" y="175" width="330" height="115" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="865" y="214" text-anchor="middle">embedded.statement</text>
  <text class="small" x="865" y="242" text-anchor="middle">driver.Stmt</text>
  <text class="small" x="865" y="267" text-anchor="middle">retains SQL and connection</text>
  <rect class="box" x="330" y="425" width="245" height="85" rx="14" fill="#dbeafe" stroke="#2563eb"/>
  <text class="label" x="452" y="460" text-anchor="middle">active sql.Tx</text>
  <text class="small" x="452" y="487" text-anchor="middle">caller owns completion</text>
  <rect class="box" x="700" y="405" width="330" height="95" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="865" y="442" text-anchor="middle">Managers.CreateQueryPlan</text>
  <text class="small" x="865" y="472" text-anchor="middle">Plan.Open() → query.Scan</text>
  <rect class="box" x="700" y="530" width="330" height="90" rx="14" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="label" x="865" y="560" text-anchor="middle">driver.Rows</text>
  <text class="small" x="865" y="587" text-anchor="middle">Columns / Next / Close</text>
  <text class="small" x="865" y="607" text-anchor="middle">DatabaseTypeName / ScanType</text>
  <path class="line" d="M250 232 H330"/><text class="small" x="290" y="215" text-anchor="middle">SQL</text>
  <path class="line" d="M575 232 H700"/><text class="small" x="637" y="215" text-anchor="middle">prepared handle</text>
  <path class="blue" d="M452 285 V425"/><text class="small" x="472" y="360">Begin</text>
  <path class="purple" d="M865 290 V350 H865 V405"/><text class="small" x="910" y="355">Stmt.Query</text>
  <path class="blue" d="M575 467 H700"/><text class="small" x="637" y="450" text-anchor="middle">same transaction</text>
  <path class="green" d="M865 500 V530"/><text class="small" x="885" y="522">projected scan</text>
  <text class="small" x="550" y="655" text-anchor="middle">ColumnTypes reports VARCHAR / INTEGER names and their Go scan types without advancing the scan.</text>
</svg>
