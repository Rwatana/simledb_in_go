<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Network URL parsing</title>
  <desc id="description">A JDBC network URL is validated and reduced to its hostname. The caller dials separately using the Java driver's default registry port 1099; URL parsing does not open a socket or create a remote session.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text class="title" x="600" y="52" text-anchor="middle">Chapter 11 / Network URL parsing</text>
  <rect class="box" x="40" y="160" width="260" height="95" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="170" y="196" text-anchor="middle">Data source name</text><text class="small" x="170" y="226" text-anchor="middle">jdbc:simpledb://db.example.org</text>
  <rect class="box" x="370" y="160" width="270" height="95" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="505" y="196" text-anchor="middle">ParseNetworkURL</text><text class="small" x="505" y="226" text-anchor="middle">validates URL host</text>
  <rect class="box" x="710" y="160" width="230" height="95" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="825" y="196" text-anchor="middle">Hostname</text><text class="small" x="825" y="226" text-anchor="middle">db.example.org</text>
  <rect class="box" x="1000" y="160" width="180" height="95" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="1090" y="196" text-anchor="middle">Caller dial</text><text class="small" x="1090" y="226" text-anchor="middle">default port 1099</text>
  <rect class="box" x="220" y="400" width="760" height="80" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="small" x="600" y="430" text-anchor="middle">Rejects empty host, explicit port, path, query, fragment, or user information.</text><text class="small" x="600" y="455" text-anchor="middle">URL parsing does not open a socket or create a remote session.</text>
  <path class="line" d="M300 207 H370"/><text class="small" x="335" y="192" text-anchor="middle">parse</text>
  <path class="line" d="M640 207 H710"/><text class="small" x="675" y="192" text-anchor="middle">host</text>
  <path class="line" d="M940 207 H1000"/><text class="small" x="970" y="192" text-anchor="middle">dial later</text>
</svg>
