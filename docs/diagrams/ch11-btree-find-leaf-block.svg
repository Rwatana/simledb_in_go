<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Find a B-tree leaf block</title>
  <desc id="desc">Directory descent closes each parent before pinning the next page. The final level-zero directory remains open for the caller, while the selected leaf block is returned without being pinned.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569" />
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .box { stroke-width: 2; rx: 12; }
      .root { fill: #dae8fc; stroke: #6c8ebf; }
      .middle { fill: #d5e8d4; stroke: #82b366; }
      .last { fill: #fff2cc; stroke: #d6b656; }
      .leaf { fill: #f8cecc; stroke: #b85450; }
      .label { font-size: 18px; font-weight: 600; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <text class="title" x="600" y="58" text-anchor="middle">Chapter 11 / Feature 58: Find a leaf block</text>
  <rect class="box root" x="60" y="150" width="320" height="125" />
  <text class="label" x="220" y="190" text-anchor="middle">
    <tspan x="220">Root directory · level 2</tspan>
    <tspan x="220" dy="28">Select child block 4</tspan>
    <tspan x="220" dy="28">Close root before next pin</tspan>
  </text>
  <rect class="box middle" x="440" y="150" width="320" height="125" />
  <text class="label" x="600" y="190" text-anchor="middle">
    <tspan x="600">Directory · level 1</tspan>
    <tspan x="600" dy="28">Select child block 9</tspan>
    <tspan x="600" dy="28">Close before next pin</tspan>
  </text>
  <rect class="box last" x="820" y="150" width="320" height="125" />
  <text class="label" x="980" y="190" text-anchor="middle">
    <tspan x="980">Directory · level 0</tspan>
    <tspan x="980" dy="28">Select leaf block 15</tspan>
    <tspan x="980" dy="28">Caller closes this page</tspan>
  </text>
  <rect class="box leaf" x="440" y="430" width="320" height="110" />
  <text class="label" x="600" y="470" text-anchor="middle">
    <tspan x="600">Returned storage.BlockID</tspan>
    <tspan x="600" dy="28">Leaf block 15 is not pinned here</tspan>
  </text>
  <path class="arrow" d="M380 210 H432" />
  <text x="406" y="190" text-anchor="middle" font-size="14">unpin 0 → pin 4</text>
  <path class="arrow" d="M760 210 H812" />
  <text x="786" y="190" text-anchor="middle" font-size="14">unpin 4 → pin 9</text>
  <path class="arrow dashed" d="M980 275 C980 375 760 370 700 422" />
  <text x="865" y="365" text-anchor="middle" font-size="16">return block 15</text>
</svg>
