<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Accept independent network RPC sessions</title>
  <desc id="description">A caller-owned net.Listener feeds a ServeListener accept loop. Each accepted connection is served concurrently by its own DriverService and transaction while sharing the configured storage managers. Each connection closes when its service stops. An unfinished transaction rolls back on disconnect; SimpleDB.Close remains committed. Closing the listener is normal shutdown.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="760" fill="#fff"/><text class="title" x="600" y="52" text-anchor="middle">Chapter 11 / Accept independent network RPC sessions</text>
  <rect class="box" x="40" y="170" width="230" height="95" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="155" y="207" text-anchor="middle">Caller-owned net.Listener</text><text class="small" x="155" y="238" text-anchor="middle">Close controls shutdown</text>
  <rect class="box" x="350" y="170" width="230" height="95" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="465" y="207" text-anchor="middle">ServeListener</text><text class="small" x="465" y="238" text-anchor="middle">accept loop continues</text>
  <rect class="box" x="680" y="110" width="210" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="785" y="145" text-anchor="middle">net.Conn #1</text><text class="small" x="785" y="175" text-anchor="middle">accepted transport</text>
  <rect class="box" x="970" y="110" width="210" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="1075" y="145" text-anchor="middle">ServeConnection #1</text><text class="small" x="1075" y="175" text-anchor="middle">independent service + tx</text>
  <rect class="box" x="680" y="280" width="210" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="785" y="315" text-anchor="middle">net.Conn #2</text><text class="small" x="785" y="345" text-anchor="middle">accepted transport</text>
  <rect class="box" x="970" y="280" width="210" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="1075" y="315" text-anchor="middle">ServeConnection #2</text><text class="small" x="1075" y="345" text-anchor="middle">independent service + tx</text>
  <rect class="box" x="400" y="455" width="400" height="85" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text class="label" x="600" y="490" text-anchor="middle">Shared configured Managers</text><text class="small" x="600" y="520" text-anchor="middle">storage shared; session state is not</text>
  <rect class="box" x="170" y="600" width="860" height="75" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="label" x="600" y="630" text-anchor="middle">Disconnect rolls back any unfinished transaction unless SimpleDB.Close committed it</text><text class="small" x="600" y="655" text-anchor="middle">Accepted connections close after service exit; closing the listener returns normally</text>
  <path class="line" d="M270 217 H350"/><path class="line" d="M580 195 H620 V155 H680"/><path class="line" d="M580 220 H620 V325 H680"/><path class="line" d="M890 155 H970"/><path class="line" d="M890 325 H970"/><path class="line" d="M600 455 V415 H1075 V370"/><path class="line" d="M600 455 V415 H1075 V200"/>
  <text class="small" x="310" y="202" text-anchor="middle">Accept</text><text class="small" x="640" y="140" text-anchor="middle">goroutine</text><text class="small" x="640" y="310" text-anchor="middle">goroutine</text><text class="small" x="930" y="140" text-anchor="middle">ServeConn</text><text class="small" x="930" y="310" text-anchor="middle">ServeConn</text>
</svg>
