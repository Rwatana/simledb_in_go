<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Embedded database/sql connector</title>
  <desc id="description">An application passes an embedded Connector to sql.OpenDB. database/sql calls Connect with a context and receives a fresh embedded Connection backed by the bound server Managers. Connector.Driver returns a Driver.Open adapter, whose data source name is ignored because the manager set was selected when constructing the Connector.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.purple{fill:none;stroke:#7c3aed;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text class="title" x="600" y="50" text-anchor="middle">Chapter 11 / Embedded database/sql connector</text>
  <rect class="box" x="40" y="120" width="220" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="150" y="157" text-anchor="middle">Go application</text>
  <text class="small" x="150" y="184" text-anchor="middle">database/sql caller</text>
  <rect class="box" x="360" y="120" width="220" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/>
  <text class="label" x="470" y="157" text-anchor="middle">sql.DB</text>
  <text class="small" x="470" y="184" text-anchor="middle">database/sql</text>
  <rect class="box" x="360" y="315" width="220" height="95" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="470" y="354" text-anchor="middle">embedded.Connector</text>
  <text class="small" x="470" y="383" text-anchor="middle">implements driver.Connector</text>
  <rect class="box" x="40" y="315" width="220" height="95" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="150" y="354" text-anchor="middle">connectorDriver</text>
  <text class="small" x="150" y="383" text-anchor="middle">Driver.Open(name)</text>
  <rect class="box" x="760" y="315" width="250" height="95" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="885" y="354" text-anchor="middle">embedded.Connection</text>
  <text class="small" x="885" y="383" text-anchor="middle">fresh driver.Conn</text>
  <rect class="box" x="760" y="490" width="250" height="85" rx="14" fill="#fce7f3" stroke="#db2777"/>
  <text class="label" x="885" y="526" text-anchor="middle">server.Managers</text>
  <text class="small" x="885" y="552" text-anchor="middle">caller-bound database</text>
  <path class="line" d="M260 165 H360"/><text class="small" x="310" y="150" text-anchor="middle">sql.OpenDB</text>
  <path class="line" d="M470 210 V315"/><text class="small" x="525" y="270">Connect(ctx)</text>
  <path class="line" d="M580 362 H760"/><text class="small" x="670" y="346" text-anchor="middle">fresh connection</text>
  <path class="line" d="M360 385 H260"/><text class="small" x="310" y="405" text-anchor="middle">Driver()</text>
  <path class="purple" d="M150 410 V455 H330 V362 H360"/><text class="small" x="245" y="448" text-anchor="middle">Open(name); name ignored</text>
  <path class="line" d="M885 410 V490"/><text class="small" x="945" y="458">Begin</text>
  <text class="small" x="600" y="620" text-anchor="middle">The Connector is bound to one manager set; URL parsing and network transport are separate behaviors.</text>
</svg>
