<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" role="img" aria-labelledby="title desc"><title id="title">Project scan</title><desc id="desc">ProjectScan reports a selected field list while delegating row traversal and reads to its input scan.</desc><style>.t{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.h{font-family:Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;fill:#1f2937}.x{font-family:Helvetica,Arial,sans-serif;font-size:17px;fill:#1f2937}</style><rect width="1300" height="700" fill="#fff"/><text class="t" x="650" y="70" text-anchor="middle">Chapter 8 / Feature 30: Project scan</text><rect x="70" y="260" width="300" height="160" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text class="h" x="220" y="310" text-anchor="middle">Input Scan</text><text class="x" x="220" y="350" text-anchor="middle">all source fields</text><text class="x" x="220" y="382" text-anchor="middle">rows unchanged</text><rect x="500" y="260" width="340" height="160" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text class="h" x="670" y="310" text-anchor="middle">ProjectScan</text><text class="x" x="670" y="350" text-anchor="middle">HasField checks projection</text><text class="x" x="670" y="382" text-anchor="middle">reads delegate to source</text><rect x="960" y="260" width="270" height="160" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text class="h" x="1095" y="310" text-anchor="middle">Visible fields</text><text class="x" x="1095" y="350" text-anchor="middle">id · grade</text><text class="x" x="1095" y="382" text-anchor="middle">name is not projected</text><rect x="500" y="520" width="340" height="90" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text class="x" x="670" y="560" text-anchor="middle">source error</text><text class="x" x="670" y="590" text-anchor="middle">wrapped with project-scan context</text><path d="M370 340H500 M840 340H960 M670 420V520" stroke="#475569" stroke-width="3" fill="none"/><polygon points="500,340 486,332 486,348" fill="#475569"/><polygon points="960,340 946,332 946,348" fill="#475569"/><polygon points="670,520 662,506 678,506" fill="#475569"/></svg>
