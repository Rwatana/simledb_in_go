<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 22: Pin a cache miss</title><desc id="description">cache missでfirst unpinned frameを選び、状態別の既存lifecycleを通して割り当て、成功後だけpinする。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#1f2937}.box{stroke-width:2}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1400" height="900" fill="#ffffff"/><text class="title" x="700" y="58" text-anchor="middle">Chapter 4 / Feature 22: Pin a cache miss</text>
  <rect class="box" x="50" y="260" width="245" height="150" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="172" y="305" text-anchor="middle">Target is not cached</text><text class="text" x="172" y="365" text-anchor="middle">Manager mutex held</text>
  <rect class="box" x="375" y="260" width="245" height="150" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="497" y="305" text-anchor="middle">First unpinned frame</text><text class="text" x="497" y="365" text-anchor="middle">pool-order selection</text>
  <rect class="box" x="725" y="100" width="230" height="135" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="840" y="145" text-anchor="middle">Unassigned</text><text class="text" x="840" y="195" text-anchor="middle">assignToBlock</text>
  <rect class="box" x="725" y="270" width="230" height="135" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="840" y="315" text-anchor="middle">Clean assigned</text><text class="text" x="840" y="365" text-anchor="middle">reassignToBlock</text>
  <rect class="box" x="725" y="440" width="230" height="155" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="840" y="480" text-anchor="middle">Dirty assigned</text><text class="text" x="840" y="525" text-anchor="middle">WAL + flush</text><text class="text" x="840" y="560" text-anchor="middle">replaceDirtyWithBlock</text>
  <rect class="box" x="1080" y="245" width="270" height="185" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="1215" y="290" text-anchor="middle">Assignment succeeded</text><text class="text" x="1215" y="345" text-anchor="middle">pin count 0 → 1</text><text class="text" x="1215" y="390" text-anchor="middle">Available − 1</text>
  <rect class="box" x="375" y="525" width="245" height="155" rx="12" fill="#f5f5f5" stroke="#666666"/><text class="heading" x="497" y="570" text-anchor="middle">No unpinned frame</text><text class="text" x="497" y="620" text-anchor="middle">return nil, false</text><text class="text" x="497" y="652" text-anchor="middle">no state change</text>
  <line x1="295" y1="335" x2="375" y2="335" stroke="#475569" stroke-width="3"/><polygon points="375,335 361,327 361,343" fill="#475569"/>
  <line x1="620" y1="300" x2="725" y2="168" stroke="#475569" stroke-width="3"/><polygon points="725,168 710,172 722,182" fill="#475569"/>
  <line x1="620" y1="335" x2="725" y2="337" stroke="#475569" stroke-width="3"/><polygon points="725,337 711,329 711,345" fill="#475569"/>
  <line x1="620" y1="370" x2="725" y2="517" stroke="#475569" stroke-width="3"/><polygon points="725,517 722,502 709,511" fill="#475569"/>
  <line x1="497" y1="410" x2="497" y2="525" stroke="#475569" stroke-width="3"/><polygon points="497,525 489,511 505,511" fill="#475569"/>
  <line x1="955" y1="168" x2="1080" y2="300" stroke="#475569" stroke-width="3"/><polygon points="1080,300 1076,285 1065,296" fill="#475569"/>
  <line x1="955" y1="337" x2="1080" y2="337" stroke="#475569" stroke-width="3"/><polygon points="1080,337 1066,329 1066,345" fill="#475569"/>
  <line x1="955" y1="517" x2="1080" y2="390" stroke="#475569" stroke-width="3"/><polygon points="1080,390 1065,394 1077,404" fill="#475569"/>
  <rect class="box" x="220" y="765" width="960" height="85" rx="12" fill="#f5f5f5" stroke="#666666"/><text class="heading" x="700" y="800" text-anchor="middle">Selection, lifecycle dispatch, and accounting share one critical section.</text><text class="text" x="700" y="832" text-anchor="middle">Failed I/O never pins the frame or consumes availability.</text>
</svg>
