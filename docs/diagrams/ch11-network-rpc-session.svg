<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Connection-bound RPC transaction</title>
  <desc id="description">A Go net/rpc SimpleDB.Connect request creates one transaction through Managers, appends its START record, returns the ID, and retains the transaction on the connection service. Transaction completion and SQL remain separate.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/><text class="title" x="600" y="52" text-anchor="middle">Chapter 11 / Connection-bound RPC transaction</text>
  <rect class="box" x="40" y="150" width="220" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="150" y="185" text-anchor="middle">Network client</text><text class="small" x="150" y="213" text-anchor="middle">net/rpc client</text>
  <rect class="box" x="340" y="150" width="220" height="90" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="450" y="185" text-anchor="middle">SimpleDB.Connect</text><text class="small" x="450" y="213" text-anchor="middle">empty request</text>
  <rect class="box" x="640" y="150" width="220" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text class="label" x="750" y="185" text-anchor="middle">DriverService</text><text class="small" x="750" y="213" text-anchor="middle">one per connection</text>
  <rect class="box" x="940" y="150" width="220" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="1050" y="185" text-anchor="middle">Managers.NewTransaction</text><text class="small" x="1050" y="213" text-anchor="middle">append START record</text>
  <rect class="box" x="340" y="390" width="220" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="450" y="425" text-anchor="middle">ConnectResponse</text><text class="small" x="450" y="453" text-anchor="middle">transaction ID</text>
  <rect class="box" x="640" y="390" width="420" height="90" rx="14" fill="#f3e8ff" stroke="#9333ea"/><text class="label" x="850" y="425" text-anchor="middle">Connection service retains transaction</text><text class="small" x="850" y="453" text-anchor="middle">for later RPC methods</text>
  <rect class="box" x="300" y="570" width="600" height="55" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="small" x="600" y="603" text-anchor="middle">Commit, rollback, close, and SQL execution are separate behaviors.</text>
  <path class="line" d="M260 195 H340"/><path class="line" d="M560 195 H640"/><path class="line" d="M860 195 H940"/><path class="line" d="M750 240 V315 H450 V390"/><path class="line" d="M750 240 V390 H640"/>
  <text class="small" x="300" y="180" text-anchor="middle">gob RPC</text><text class="small" x="600" y="180" text-anchor="middle">dispatch</text><text class="small" x="900" y="180" text-anchor="middle">create one</text><text class="small" x="600" y="300" text-anchor="middle">ID</text><text class="small" x="700" y="315" text-anchor="middle">retained</text>
</svg>
