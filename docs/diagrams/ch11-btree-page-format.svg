<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">B-tree page formatting</title>
  <desc id="desc">Initialize the signed page flag and zero record count, then default every complete record slot after the eight-byte header while leaving a partial tail unused.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569" />
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .slot { stroke-width: 2; rx: 12; }
      .header { fill: #fff2cc; stroke: #d6b656; }
      .record { fill: #d5e8d4; stroke: #82b366; }
      .tail { fill: #f8cecc; stroke: #b85450; }
      .rule { fill: #e1d5e7; stroke: #9673a6; }
    </style>
  </defs>
  <text class="title" x="600" y="60" text-anchor="middle">Chapter 11 / Feature 53: Format a B-tree page</text>
  <text class="label" x="600" y="111" text-anchor="middle">Target block · signed flag and zero record count</text>
  <rect class="slot header" x="130" y="140" width="230" height="82" />
  <rect class="slot header" x="385" y="140" width="230" height="82" />
  <rect class="slot record" x="640" y="140" width="230" height="105" />
  <rect class="slot record" x="895" y="140" width="230" height="105" />
  <text x="245" y="174" text-anchor="middle" font-size="18"><tspan x="245">byte 0–3</tspan><tspan x="245" dy="27">flag = -3</tspan></text>
  <text x="500" y="174" text-anchor="middle" font-size="18"><tspan x="500">byte 4–7</tspan><tspan x="500" dy="27">count = 0</tspan></text>
  <text x="755" y="165" text-anchor="middle" font-size="17"><tspan x="755">slot 0</tspan><tspan x="755" dy="25">dataval = empty</tspan><tspan x="755" dy="24">block = 0 · id = 0</tspan></text>
  <text x="1010" y="165" text-anchor="middle" font-size="17"><tspan x="1010">slot 1</tspan><tspan x="1010" dy="25">dataval = empty</tspan><tspan x="1010" dy="24">block = 0 · id = 0</tspan></text>
  <path d="M360 181 H378" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M615 181 H633" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M870 192 H888" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect class="slot tail" x="210" y="295" width="340" height="88" />
  <text x="380" y="330" text-anchor="middle" font-size="17"><tspan x="380">unused partial tail</tspan><tspan x="380" dy="26">not initialized as a record</tspan></text>
  <rect class="slot rule" x="590" y="295" width="500" height="88" />
  <text x="840" y="330" text-anchor="middle" font-size="19" font-weight="700"><tspan x="840">Initialize only complete slots after the 8-byte header</tspan><tspan x="840" dy="27">Schema order · integer = 0 · varchar = empty</tspan></text>
  <path d="M550 339 H583" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="600" y="481" text-anchor="middle" font-size="17" fill="#475569">All writes disable logging; the caller owns the target block's pin lifecycle.</text>
</svg>
