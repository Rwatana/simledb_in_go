<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 2: Append within one log block</title>
  <desc id="description">3-byte payloadをlength prefix付きでblock右端へ格納し、boundaryを32から25へ更新してLSN 1を返す。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.small{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#4b5563}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/>
  <text class="title" x="700" y="58" text-anchor="middle">Chapter 4 / Feature 2: Append within one log block</text>
  <rect class="box" x="70" y="155" width="470" height="250" rx="12" fill="#f8fafc" stroke="#475569"/>
  <text class="heading" x="305" y="198" text-anchor="middle">Before: boundary = 32</text>
  <rect class="box" x="95" y="245" width="100" height="90" fill="#fff2cc" stroke="#d6b656"/><text class="small" x="145" y="278" text-anchor="middle">0..3</text><text class="heading" x="145" y="313" text-anchor="middle">32</text>
  <rect class="box" x="195" y="245" width="300" height="90" fill="#dae8fc" stroke="#6c8ebf"/><text class="small" x="345" y="278" text-anchor="middle">4..31</text><text class="heading" x="345" y="313" text-anchor="middle">free</text>
  <rect class="box" x="575" y="165" width="300" height="220" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="heading" x="725" y="205" text-anchor="middle">Append(DE AD 00)</text><text class="text" x="725" y="257" text-anchor="middle">encoded length = 4 + 3 = 7</text><text class="text" x="725" y="294" text-anchor="middle">record position = 32 - 7 = 25</text><text class="heading" x="725" y="342" text-anchor="middle">LSN = 1</text>
  <line x1="540" y1="275" x2="575" y2="275" stroke="#475569" stroke-width="3"/>
  <rect class="box" x="910" y="145" width="420" height="270" rx="12" fill="#f8fafc" stroke="#475569"/>
  <text class="heading" x="1120" y="188" text-anchor="middle">After: boundary = 25</text>
  <rect class="box" x="930" y="235" width="80" height="100" fill="#fff2cc" stroke="#d6b656"/><text class="small" x="970" y="272" text-anchor="middle">0..3</text><text class="heading" x="970" y="310" text-anchor="middle">25</text>
  <rect class="box" x="1010" y="235" width="170" height="100" fill="#dae8fc" stroke="#6c8ebf"/><text class="small" x="1095" y="272" text-anchor="middle">4..24</text><text class="heading" x="1095" y="310" text-anchor="middle">free</text>
  <rect x="1180" y="235" width="130" height="100" fill="#d5e8d4" stroke="#82b366" stroke-width="4"/><text class="small" x="1245" y="262" text-anchor="middle">25..31</text><text class="text" x="1245" y="290" text-anchor="middle">length 3</text><text class="small" x="1245" y="318" text-anchor="middle">03 DE AD 00</text>
  <line x1="875" y1="275" x2="910" y2="275" stroke="#475569" stroke-width="3"/>
  <rect class="box" x="250" y="650" width="900" height="90" rx="12" fill="#f8cecc" stroke="#b85450"/>
  <text class="heading" x="700" y="705" text-anchor="middle">New records grow right → left; boundary always points to the newest record.</text>
</svg>
