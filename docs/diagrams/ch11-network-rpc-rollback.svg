<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Network RPC rollback cycle</title>
  <desc id="description">SimpleDB.Rollback rolls back the transaction held by one connection service, writes a durable ROLLBACK record, starts and retains a successor transaction, and returns its ID. Rollback failure preserves the current transaction; successor-start failure leaves no stale completed transaction.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/><text class="title" x="600" y="52" text-anchor="middle">Chapter 11 / Network RPC rollback cycle</text>
  <rect class="box" x="40" y="150" width="210" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="145" y="185" text-anchor="middle">RPC client</text><text class="small" x="145" y="213" text-anchor="middle">SimpleDB.Rollback</text>
  <rect class="box" x="320" y="150" width="220" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text class="label" x="430" y="185" text-anchor="middle">DriverService</text><text class="small" x="430" y="213" text-anchor="middle">retains transaction 1</text>
  <rect class="box" x="620" y="150" width="240" height="90" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="740" y="185" text-anchor="middle">Transaction.Rollback</text><text class="small" x="740" y="213" text-anchor="middle">durable ROLLBACK record</text>
  <rect class="box" x="930" y="150" width="230" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="1045" y="185" text-anchor="middle">Managers.NewTransaction</text><text class="small" x="1045" y="213" text-anchor="middle">START transaction 2</text>
  <rect class="box" x="620" y="390" width="240" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="740" y="425" text-anchor="middle">RollbackResponse</text><text class="small" x="740" y="453" text-anchor="middle">transaction ID 2</text>
  <rect class="box" x="210" y="570" width="780" height="60" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="small" x="600" y="596" text-anchor="middle">Rollback failure keeps the current transaction; successor START failure leaves no stale completed transaction.</text>
  <path class="line" d="M250 195 H320"/><path class="line" d="M540 195 H620"/><path class="line" d="M860 195 H930"/><path class="line" d="M1045 240 V330 H740 V390"/><path class="line" d="M1045 240 V300 H430 V240"/>
  <text class="small" x="285" y="180" text-anchor="middle">gob RPC</text><text class="small" x="580" y="180" text-anchor="middle">rollback</text><text class="small" x="895" y="180" text-anchor="middle">success</text><text class="small" x="900" y="315" text-anchor="middle">new ID</text><text class="small" x="720" y="285" text-anchor="middle">retains successor</text>
</svg>
