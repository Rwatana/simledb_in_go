<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 24: Notify after final release</title><desc id="description">final unpinでavailableを増やした後、同じManager mutexに結び付いたcondition variableでwaiterを起こす。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/><text class="title" x="700" y="58" text-anchor="middle">Chapter 4 / Feature 24: Notify after final release</text>
  <rect class="box" x="80" y="245" width="285" height="205" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="222" y="290" text-anchor="middle">Future pin waiter</text><text class="text" x="222" y="340" text-anchor="middle">available == 0</text><text class="text" x="222" y="380" text-anchor="middle">Cond.Wait()</text><text class="text" x="222" y="420" text-anchor="middle">releases Manager mutex</text>
  <rect class="box" x="495" y="245" width="270" height="170" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="630" y="290" text-anchor="middle">Manager.Unpin</text><text class="text" x="630" y="355" text-anchor="middle">under Manager mutex</text>
  <rect class="box" x="920" y="110" width="300" height="170" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="1070" y="155" text-anchor="middle">pin count remains &gt; 0</text><text class="text" x="1070" y="210" text-anchor="middle">available unchanged</text><text class="text" x="1070" y="248" text-anchor="middle">no broadcast</text>
  <rect class="box" x="920" y="390" width="300" height="185" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="1070" y="435" text-anchor="middle">pin count 1 → 0</text><text class="text" x="1070" y="490" text-anchor="middle">available + 1</text><text class="text" x="1070" y="535" text-anchor="middle">Cond.Broadcast()</text>
  <rect class="box" x="495" y="565" width="270" height="145" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="630" y="610" text-anchor="middle">Waiter reacquires mutex</text><text class="text" x="630" y="665" text-anchor="middle">rechecks available</text>
  <line x1="365" y1="345" x2="495" y2="345" stroke="#475569" stroke-width="3"/><polygon points="495,345 481,337 481,353" fill="#475569"/>
  <line x1="765" y1="290" x2="920" y2="195" stroke="#475569" stroke-width="3"/><polygon points="920,195 905,195 913,208" fill="#475569"/>
  <line x1="765" y1="370" x2="920" y2="482" stroke="#475569" stroke-width="3"/><polygon points="920,482 914,468 905,480" fill="#475569"/>
  <line x1="920" y1="540" x2="765" y2="625" stroke="#475569" stroke-width="3"/><polygon points="765,625 780,625 773,612" fill="#475569"/>
  <rect class="box" x="220" y="750" width="960" height="65" rx="12" fill="#f5f5f5" stroke="#666666"/><text class="heading" x="700" y="790" text-anchor="middle">Condition and predicate share one mutex; waiters loop and recheck.</text>
</svg>
