<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: database/sql autocommit ownership</title>
  <desc id="description">For database-level Exec, the embedded connection creates a server transaction, executes the update, commits on success or rolls back on failure, and returns affected rows. Calls through sql.Tx reuse the connection's active transaction and leave explicit completion to the caller.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.muted{fill:none;stroke:#6b7280;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="680" fill="#fff"/>
  <text class="title" x="600" y="50" text-anchor="middle">Chapter 11 / database/sql autocommit ownership</text>
  <rect class="box" x="35" y="140" width="220" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/><text class="label" x="145" y="178" text-anchor="middle">application</text><text class="small" x="145" y="207" text-anchor="middle">sql.DB.Exec(query)</text>
  <rect class="box" x="345" y="140" width="250" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="470" y="178" text-anchor="middle">embedded.Connection</text><text class="small" x="470" y="207" text-anchor="middle">driver.Execer</text>
  <rect class="box" x="700" y="100" width="300" height="90" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="label" x="850" y="138" text-anchor="middle">Managers.NewTransaction</text><text class="small" x="850" y="166" text-anchor="middle">when no transaction is active</text>
  <rect class="box" x="700" y="280" width="300" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text class="label" x="850" y="318" text-anchor="middle">Managers.ExecuteUpdate</text><text class="small" x="850" y="346" text-anchor="middle">parse and plan with transaction</text>
  <rect class="box" x="700" y="450" width="300" height="90" rx="14" fill="#fce7f3" stroke="#db2777"/><text class="label" x="850" y="488" text-anchor="middle">Commit on success</text><text class="small" x="850" y="516" text-anchor="middle">Rollback on update failure</text>
  <rect class="box" x="345" y="450" width="250" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text class="label" x="470" y="488" text-anchor="middle">driver.RowsAffected</text><text class="small" x="470" y="516" text-anchor="middle">returned to application</text>
  <rect class="box" x="35" y="320" width="220" height="90" rx="14" fill="#f3f4f6" stroke="#6b7280"/><text class="label" x="145" y="358" text-anchor="middle">sql.Tx.Exec(query)</text><text class="small" x="145" y="386" text-anchor="middle">reuses active transaction</text>
  <rect class="box" x="35" y="500" width="220" height="90" rx="14" fill="#fce7f3" stroke="#db2777"/><text class="label" x="145" y="538" text-anchor="middle">Caller completes</text><text class="small" x="145" y="566" text-anchor="middle">explicit Commit / Rollback</text>
  <path class="line" d="M255 185 H345"/><text class="small" x="300" y="170" text-anchor="middle">SQL</text>
  <path class="line" d="M595 165 H700"/><text class="small" x="647" y="150" text-anchor="middle">no active tx</text>
  <path class="line" d="M850 190 V280"/><text class="small" x="910" y="242">new tx</text>
  <path class="line" d="M850 370 V450"/><text class="small" x="920" y="416">result / error</text>
  <path class="line" d="M700 495 H595"/><text class="small" x="647" y="480" text-anchor="middle">affected count</text>
  <path class="muted" d="M255 365 H315 V207 H345"/><text class="small" x="310" y="300" text-anchor="middle">active tx</text>
  <path class="muted" d="M145 410 V500"/><text class="small" x="165" y="462">no auto-commit</text>
</svg>
