<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Opening a multibuffer product plan</title>
  <desc id="desc">The plan opens the left scan, materializes the right plan into a temporary table, pins bounded right chunks, and returns an owned left-major product scan.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52606d"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #243447; }
      .box { stroke-width: 2; rx: 12; }
      .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
      .sub { font-size: 14px; text-anchor: middle; }
      .edge { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font-size: 13px; fill: #52606d; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1120" height="620" fill="#ffffff"/>
  <text x="560" y="44" class="label">MultibufferProductPlan.Open</text>
  <rect class="box" x="55" y="110" width="180" height="66" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="145" y="150" class="label">Left query plan</text>
  <rect class="box" x="55" y="330" width="180" height="66" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="145" y="370" class="label">Right query plan</text>
  <rect class="box" x="340" y="205" width="220" height="82" fill="#d5e8d4" stroke="#82b366"/>
  <text x="450" y="240" class="label">Product plan</text>
  <text x="450" y="264" class="sub">validates and coordinates</text>
  <rect class="box" x="640" y="95" width="190" height="66" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="735" y="135" class="label">Owned left scan</text>
  <rect class="box" x="640" y="210" width="190" height="78" fill="#fff2cc" stroke="#d6b656"/>
  <text x="735" y="242" class="label">Temporary table</text>
  <text x="735" y="266" class="sub">copies right-plan rows</text>
  <rect class="box" x="640" y="340" width="190" height="66" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="735" y="380" class="label">Bounded chunk scan</text>
  <rect class="box" x="900" y="205" width="185" height="82" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="992" y="239" class="label">Left-major product</text>
  <text x="992" y="264" class="sub">releases right pins on close</text>
  <path class="edge" d="M235 142 C275 142 292 208 340 220"/>
  <path class="edge" d="M235 362 C280 362 293 286 340 273"/>
  <text x="278" y="320" class="edge-label">materializes</text>
  <path class="edge" d="M560 220 C590 198 600 140 640 128"/>
  <text x="600" y="174" class="edge-label">opens</text>
  <path class="edge" d="M560 255 L640 250"/>
  <path class="edge" d="M735 288 L735 340"/>
  <text x="782" y="320" class="edge-label">pins bounded pages</text>
  <path class="edge" d="M830 128 C865 128 870 220 900 230"/>
  <path class="edge" d="M830 373 C865 373 870 275 900 264"/>
  <path class="edge" d="M1085 246 C1100 410 1000 490 790 500 L450 500 L450 287"/>
  <text x="785" y="480" class="edge-label">returns a caller-owned query scan</text>
  <text x="560" y="570" class="sub">The owner closes both the opened left scan and the active right-chunk pages.</text>
</svg>
