<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title description">
  <title id="title">Chapter 12 Feature 1: Index traversal contract</title>
  <desc id="description">The index.Index contract positions a search by query.Constant, advances through matching entries, returns each table record.RID, inserts and deletes value/RID pairs, and closes resources. Each fallible Go operation returns an explicit error. Hash and B-tree storage behavior remains separate.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>.title{font:700 24px sans-serif;fill:#1f2937}.box{stroke-width:2;rx:16;ry:16}.label{font:17px sans-serif;fill:#1f2937;text-anchor:middle}.small{font:15px sans-serif;fill:#475569;text-anchor:middle}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <text class="title" x="550" y="62" text-anchor="middle">Chapter 12 / Feature 1: Index traversal contract</text>
  <rect class="box" x="45" y="210" width="240" height="100" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="label" x="165" y="246"><tspan x="165">query.Constant</tspan><tspan x="165" dy="27">search key / data value</tspan></text>
  <rect class="box" x="360" y="160" width="380" height="245" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="550" y="194"><tspan x="550">index.Index</tspan><tspan x="550" dy="31">BeforeFirst(Constant) → error</tspan><tspan x="550" dy="28">Next() → (found, error)</tspan><tspan x="550" dy="28">GetDataRID() → (RID, error)</tspan><tspan x="550" dy="28">Insert(Constant, RID) → error</tspan><tspan x="550" dy="28">Delete(Constant, RID) → error</tspan><tspan x="550" dy="28">Close() → error</tspan></text>
  <rect class="box" x="815" y="210" width="240" height="100" fill="#d5e8d4" stroke="#82b366"/>
  <text class="label" x="935" y="246"><tspan x="935">record.RID</tspan><tspan x="935" dy="27">table record identifier</tspan></text>
  <rect class="box" x="320" y="480" width="460" height="100" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="label" x="550" y="514"><tspan x="550">Concrete index storage</tspan><tspan x="550" dy="25">hash or B-tree behavior is separate</tspan><tspan x="550" dy="25">duplicate ordering is implementation-defined</tspan></text>
  <text class="small" x="550" y="446" style="fill:#b85450">Go error results preserve storage failures</text>
  <path class="edge" d="M285 260 H352"/><text class="small" x="320" y="246">search / mutation value</text>
  <path class="edge" d="M748 260 H807"/><text class="small" x="778" y="246">matched data RID</text>
  <path class="edge" d="M550 480 V413"/><text class="small" x="603" y="460">implemented by</text>
</svg>
