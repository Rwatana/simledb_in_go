<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 17: Initialize buffer pool</title><desc id="description">Buffer Managerが指定数のdistinctな未割当Buffer frameを所有し、全件をavailableとして開始する。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/><text class="title" x="700" y="60" text-anchor="middle">Chapter 4 / Feature 17: Initialize buffer pool</text>
  <rect class="box" x="90" y="240" width="300" height="210" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="240" y="290" text-anchor="middle">Buffer Manager</text><text class="text" x="240" y="350" text-anchor="middle">Capacity = N</text><text class="text" x="240" y="400" text-anchor="middle">Available = N</text>
  <rect class="box" x="550" y="150" width="270" height="210" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="heading" x="685" y="195" text-anchor="middle">Frame 0</text><text class="text" x="685" y="240" text-anchor="middle">unassigned</text><text class="text" x="685" y="280" text-anchor="middle">clean · pin count 0</text><text class="text" x="685" y="320" text-anchor="middle">Page size = block size</text>
  <rect class="box" x="920" y="150" width="270" height="210" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="1055" y="195" text-anchor="middle">Frame 1</text><text class="text" x="1055" y="240" text-anchor="middle">unassigned</text><text class="text" x="1055" y="280" text-anchor="middle">clean · pin count 0</text><text class="text" x="1055" y="320" text-anchor="middle">Page size = block size</text>
  <rect class="box" x="735" y="470" width="270" height="170" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="870" y="515" text-anchor="middle">… Frame N-1</text><text class="text" x="870" y="560" text-anchor="middle">distinct Buffer</text><text class="text" x="870" y="600" text-anchor="middle">same dependencies</text>
  <line x1="390" y1="300" x2="550" y2="245" stroke="#475569" stroke-width="3"/><polygon points="550,245 536,242 541,255" fill="#475569"/><polyline points="390,345 470,345 470,110 1055,110 1055,150" fill="none" stroke="#475569" stroke-width="3"/><polygon points="1055,150 1047,137 1063,137" fill="#475569"/><line x1="390" y1="400" x2="735" y2="555" stroke="#475569" stroke-width="3"/><polygon points="735,555 724,544 718,557" fill="#475569"/>
  <rect class="box" x="240" y="700" width="920" height="80" rx="12" fill="#f5f5f5" stroke="#666666"/><text class="heading" x="700" y="748" text-anchor="middle">Initialization performs no lookup, assignment, pinning, or replacement.</text>
</svg>
