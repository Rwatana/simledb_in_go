<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 5: Current-block reverse iterator</title>
  <desc id="description">current Pageをcopyし、boundaryからLSN 3、2、1の順にrecordを読む。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/>
  <text class="title" x="700" y="60" text-anchor="middle">Chapter 4 / Feature 5: Current-block reverse iterator</text>
  <rect class="box" x="80" y="145" width="380" height="260" rx="12" fill="#f8fafc" stroke="#475569"/>
  <text class="heading" x="270" y="187" text-anchor="middle">Manager current Page</text>
  <rect class="box" x="100" y="227" width="340" height="120" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="text" x="270" y="267" text-anchor="middle">boundary → LSN 3 → LSN 2 → LSN 1</text><text class="text" x="270" y="315" text-anchor="middle">right-to-left append layout</text>
  <rect class="box" x="545" y="175" width="250" height="200" rx="12" fill="#fff2cc" stroke="#d6b656"/>
  <text class="heading" x="670" y="215" text-anchor="middle">Iterator()</text><text class="text" x="670" y="260" text-anchor="middle">copy Page</text><text class="text" x="670" y="300" text-anchor="middle">position = boundary</text><text class="text" x="670" y="340" text-anchor="middle">no disk write</text>
  <line x1="460" y1="275" x2="545" y2="275" stroke="#475569" stroke-width="3"/><polygon points="545,275 532,267 532,283" fill="#475569"/>
  <rect class="box" x="880" y="145" width="440" height="260" rx="12" fill="#f8fafc" stroke="#475569"/>
  <text class="heading" x="1100" y="187" text-anchor="middle">Immutable iterator snapshot</text>
  <rect class="box" x="925" y="220" width="350" height="140" rx="10" fill="#d5e8d4" stroke="#82b366"/>
  <text class="text" x="1100" y="250" text-anchor="middle">Next() → LSN 3</text><text class="text" x="1100" y="280" text-anchor="middle">Next() → LSN 2</text><text class="text" x="1100" y="310" text-anchor="middle">Next() → LSN 1</text><text class="text" x="1100" y="340" text-anchor="middle">Next() → exhausted</text>
  <line x1="795" y1="275" x2="880" y2="275" stroke="#475569" stroke-width="3"/><polygon points="880,275 867,267 867,283" fill="#475569"/>
  <rect class="box" x="210" y="620" width="980" height="105" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="heading" x="700" y="663" text-anchor="middle">position += 4-byte length prefix + payload length</text>
  <text class="text" x="700" y="699" text-anchor="middle">Appends after snapshot creation are intentionally invisible.</text>
</svg>
