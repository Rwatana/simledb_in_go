<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Select a query-planner strategy</title>
  <desc id="description">A server manager set defaults to BasicQueryPlanner, but can select BasicQueryPlanner or BetterQueryPlanner. Both planners use the same MetadataManager, and CreateQueryPlan uses the selected planner with the caller-owned transaction. Invalid selections preserve the planner.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.metadata{fill:none;stroke:#16a34a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#green-arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text class="title" x="600" y="50" text-anchor="middle">Chapter 11 / Select a query-planner strategy</text>
  <rect class="box" x="45" y="245" width="225" height="100" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="157" y="280" text-anchor="middle">Managers</text>
  <text class="small" x="157" y="310" text-anchor="middle">default: Basic planner</text>
  <rect class="box" x="45" y="455" width="225" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="157" y="490" text-anchor="middle">MetadataManager</text>
  <text class="small" x="157" y="518" text-anchor="middle">one shared facade</text>
  <rect class="box" x="355" y="245" width="260" height="100" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="485" y="282" text-anchor="middle">SetQueryPlannerStrategy</text>
  <text class="small" x="485" y="312" text-anchor="middle">Basic or Better</text>
  <rect class="box" x="735" y="145" width="250" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="860" y="180" text-anchor="middle">BasicQueryPlanner</text>
  <text class="small" x="860" y="208" text-anchor="middle">zero-value default</text>
  <rect class="box" x="735" y="355" width="250" height="90" rx="14" fill="#fce7f3" stroke="#db2777"/>
  <text class="label" x="860" y="390" text-anchor="middle">BetterQueryPlanner</text>
  <text class="small" x="860" y="418" text-anchor="middle">cost-aware ordering</text>
  <rect class="box" x="735" y="510" width="250" height="85" rx="14" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="label" x="860" y="544" text-anchor="middle">CreateQueryPlan</text>
  <text class="small" x="860" y="572" text-anchor="middle">selected planner + caller transaction</text>
  <path class="line" d="M270 295 H355"/><text class="small" x="312" y="280" text-anchor="middle">choose</text>
  <path class="line" d="M615 270 L735 195"/><text class="small" x="670" y="213" text-anchor="middle">basic</text>
  <path class="line" d="M615 320 L735 400"/><text class="small" x="670" y="372" text-anchor="middle">better</text>
  <path class="metadata" d="M270 470 C312 445 320 335 355 305"/><text class="small" x="310" y="395" text-anchor="middle">shared metadata</text>
  <path class="line" d="M985 190 H1095 V552 H985"/><path class="line" d="M860 445 V510"/>
  <text class="small" x="1090" y="350" text-anchor="end">planning</text>
  <text class="small" x="600" y="630" text-anchor="middle">A failed selection preserves the installed planner; query transactions remain caller-owned.</text>
</svg>
