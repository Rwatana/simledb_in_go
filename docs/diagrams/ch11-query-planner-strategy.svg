<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Select a query-planner strategy</title>
  <desc id="description">A server manager set defaults to BasicQueryPlanner and can select Basic, Better, or Heuristic planning. All planners share one MetadataManager and receive the caller-owned transaction. The heuristic adapter uses a transaction-bound multibuffer product factory when supported and otherwise keeps ordinary product plans; rejected selections preserve the installed planner.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.metadata{fill:none;stroke:#16a34a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#green-arrow)}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text class="title" x="600" y="50" text-anchor="middle">Chapter 11 / Select a query-planner strategy</text>
  <rect class="box" x="45" y="330" width="225" height="100" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="157" y="365" text-anchor="middle">Managers</text>
  <text class="small" x="157" y="395" text-anchor="middle">default: Basic planner</text>
  <rect class="box" x="45" y="550" width="225" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="157" y="585" text-anchor="middle">MetadataManager</text>
  <text class="small" x="157" y="613" text-anchor="middle">one shared facade</text>
  <rect class="box" x="355" y="330" width="260" height="100" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="485" y="367" text-anchor="middle">SetQueryPlannerStrategy</text>
  <text class="small" x="485" y="397" text-anchor="middle">Basic, Better, or Heuristic</text>
  <rect class="box" x="735" y="90" width="250" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="860" y="125" text-anchor="middle">BasicQueryPlanner</text>
  <text class="small" x="860" y="153" text-anchor="middle">zero-value default</text>
  <rect class="box" x="735" y="275" width="250" height="90" rx="14" fill="#fce7f3" stroke="#db2777"/>
  <text class="label" x="860" y="310" text-anchor="middle">BetterQueryPlanner</text>
  <text class="small" x="860" y="338" text-anchor="middle">cost-aware ordering</text>
  <rect class="box" x="735" y="460" width="250" height="110" rx="14" fill="#ffedd5" stroke="#ea580c"/>
  <text class="label" x="860" y="495" text-anchor="middle">HeuristicQueryPlanner</text>
  <text class="small" x="860" y="523" text-anchor="middle">lowest-output joins</text>
  <text class="small" x="860" y="545" text-anchor="middle">multibuffer products when supported</text>
  <rect class="box" x="735" y="650" width="250" height="85" rx="14" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="label" x="860" y="684" text-anchor="middle">CreateQueryPlan</text>
  <text class="small" x="860" y="712" text-anchor="middle">selected planner + caller transaction</text>
  <path class="line" d="M270 380 H355"/><text class="small" x="312" y="365" text-anchor="middle">choose</text>
  <path class="line" d="M615 355 L680 355 L680 135 H735"/><text class="small" x="680" y="335" text-anchor="middle">basic</text>
  <path class="line" d="M615 380 H735"/><text class="small" x="675" y="370" text-anchor="middle">better</text>
  <path class="line" d="M615 405 L680 405 L680 515 H735"/><text class="small" x="680" y="435" text-anchor="middle">heuristic</text>
  <path class="metadata" d="M270 595 C325 560 315 430 355 405"/><text class="small" x="310" y="510" text-anchor="middle">shared metadata</text>
  <path class="line" d="M985 135 H1105 V692 H985"/>
  <path class="line" d="M985 320 H1070 V710 H985"/>
  <path class="line" d="M985 515 H1035 V728 H985"/>
  <text class="small" x="1088" y="385" text-anchor="end">planning</text>
  <text class="small" x="600" y="780" text-anchor="middle">A failed selection preserves the installed planner; query transactions remain caller-owned.</text>
</svg>
