<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Split a B-tree page</title>
  <desc id="desc">Keep the prefix before splitSlot in the source page and copy the suffix into a newly appended page while updating both record counts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569" />
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .box { stroke-width: 2; rx: 12; }
      .source { fill: #dae8fc; stroke: #6c8ebf; }
      .left { fill: #d5e8d4; stroke: #82b366; }
      .right { fill: #e1d5e7; stroke: #9673a6; }
      .label { font-size: 20px; font-weight: 700; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text class="title" x="600" y="60" text-anchor="middle">Chapter 12 / Feature 55: Split a B-tree page</text>
  <rect class="box source" x="145" y="120" width="910" height="92" />
  <text class="label" x="600" y="155" text-anchor="middle"><tspan x="600">Source page · count = 5</tspan><tspan x="600" dy="30">[ key 10 | key 20 | key 30 | key 40 | key 50 ]</tspan></text>
  <path d="M555 118 V235" stroke="#b85450" stroke-width="3" stroke-dasharray="8 6" />
  <text x="600" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#b85450">splitSlot = 2</text>
  <rect class="box left" x="130" y="310" width="400" height="125" />
  <text class="label" x="330" y="350" text-anchor="middle"><tspan x="330">Source keeps prefix</tspan><tspan x="330" dy="30">count = 2</tspan><tspan x="330" dy="28">[ key 10 | key 20 ]</tspan></text>
  <rect class="box right" x="670" y="310" width="440" height="125" />
  <text class="label" x="890" y="350" text-anchor="middle"><tspan x="890">New page receives suffix</tspan><tspan x="890" dy="30">count = 3 · caller flag</tspan><tspan x="890" dy="28">[ key 30 | key 40 | key 50 ]</tspan></text>
  <path class="arrow" d="M390 212 C390 275 300 280 300 302" />
  <path class="arrow" d="M760 212 C760 270 890 275 890 302" />
  <text x="600" y="510" text-anchor="middle" font-size="18" fill="#475569">Copy complete fields in order with logged writes; delete each source entry after its destination copy succeeds.</text>
</svg>
