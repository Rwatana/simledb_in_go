<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 4 Feature 18: Find existing buffer assignment</title><desc id="description">target BlockIDと一致するassigned frameをpoolから検索し、stateを変えず返す。</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.heading{font-family:Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2937}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="850" fill="#ffffff"/><text class="title" x="700" y="60" text-anchor="middle">Chapter 4 / Feature 18: Find existing assignment</text>
  <rect class="box" x="80" y="210" width="280" height="170" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text class="heading" x="220" y="255" text-anchor="middle">Target BlockID</text><text class="text" x="220" y="320" text-anchor="middle">file name + block number</text>
  <rect class="box" x="540" y="190" width="320" height="210" rx="12" fill="#fff2cc" stroke="#d6b656"/><text class="heading" x="700" y="235" text-anchor="middle">Scan pool in order</text><text class="text" x="700" y="295" text-anchor="middle">skip unassigned frames</text><text class="text" x="700" y="345" text-anchor="middle">compare complete BlockID</text>
  <rect class="box" x="1030" y="130" width="300" height="180" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="heading" x="1180" y="175" text-anchor="middle">Exact match</text><text class="text" x="1180" y="230" text-anchor="middle">return existing frame</text><text class="text" x="1180" y="270" text-anchor="middle">pin state unchanged</text>
  <rect class="box" x="1030" y="390" width="300" height="150" rx="12" fill="#f8cecc" stroke="#b85450"/><text class="heading" x="1180" y="440" text-anchor="middle">No match</text><text class="text" x="1180" y="495" text-anchor="middle">return nil, false</text>
  <line x1="360" y1="295" x2="540" y2="295" stroke="#475569" stroke-width="3"/><polygon points="540,295 527,287 527,303" fill="#475569"/><line x1="860" y1="260" x2="1030" y2="220" stroke="#475569" stroke-width="3"/><polygon points="1030,220 1017,212 1017,228" fill="#475569"/><line x1="860" y1="330" x2="1030" y2="465" stroke="#475569" stroke-width="3"/><polygon points="1030,465 1017,457 1017,473" fill="#475569"/>
  <rect class="box" x="230" y="650" width="940" height="95" rx="12" fill="#e3f2fd" stroke="#6c8ebf"/><text class="heading" x="700" y="690" text-anchor="middle">Lookup changes no frame or pool state</text><text class="text" x="700" y="722" text-anchor="middle">and holds the Manager mutex for the complete scan.</text>
</svg>
