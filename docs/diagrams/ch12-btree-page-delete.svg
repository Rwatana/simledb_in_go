<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">B-tree page entry deletion</title>
  <desc id="desc">Delete slot one by shifting complete records from slots two and three left in ascending order, then reduce the record count.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569" />
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .slot { stroke-width: 2; rx: 12; }
      .before { fill: #dae8fc; stroke: #6c8ebf; }
      .removed { fill: #f8cecc; stroke: #b85450; }
      .step { fill: #e1d5e7; stroke: #9673a6; }
      .count { fill: #fff2cc; stroke: #d6b656; }
      .after { fill: #d5e8d4; stroke: #82b366; }
    </style>
  </defs>
  <text class="title" x="600" y="58" text-anchor="middle">Chapter 12 / Feature 52: Delete a B-tree page entry</text>
  <text class="label" x="600" y="105" text-anchor="middle">Before · count = 4 · delete slot 1</text>
  <rect class="slot before" x="45" y="130" width="260" height="88" />
  <rect class="slot removed" x="335" y="130" width="260" height="88" />
  <rect class="slot before" x="625" y="130" width="260" height="88" />
  <rect class="slot before" x="915" y="130" width="260" height="88" />
  <text x="175" y="163" text-anchor="middle" font-size="17"><tspan x="175">slot 0</tspan><tspan x="175" dy="26">alpha · RID (10, 1)</tspan></text>
  <text x="465" y="155" text-anchor="middle" font-size="17"><tspan x="465">slot 1</tspan><tspan x="465" dy="25">bravo · RID (20, 2)</tspan><tspan x="465" dy="24">removed</tspan></text>
  <text x="755" y="163" text-anchor="middle" font-size="17"><tspan x="755">slot 2</tspan><tspan x="755" dy="26">charlie · RID (30, 3)</tspan></text>
  <text x="1045" y="163" text-anchor="middle" font-size="17"><tspan x="1045">slot 3</tspan><tspan x="1045" dy="26">delta · RID (40, 4)</tspan></text>
  <path d="M625 174 H603" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M915 174 H893" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <text x="600" y="245" text-anchor="middle" font-size="14">ascending source-slot order</text>
  <rect class="slot step" x="210" y="265" width="780" height="90" />
  <text x="600" y="301" text-anchor="middle" font-size="20" font-weight="700"><tspan x="600">Shift complete records left in ascending order</tspan><tspan x="600" dy="28">slot 2 → 1, then slot 3 → 2 · log each field write</tspan></text>
  <path d="M600 355 V402" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <rect class="slot count" x="210" y="410" width="780" height="70" />
  <text x="600" y="452" text-anchor="middle" font-size="19" font-weight="700">After all copies succeed, decrement the page record count</text>
  <path d="M600 480 V495" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <text class="label" x="600" y="531" text-anchor="middle">After · count = 3</text>
  <rect class="slot after" x="105" y="548" width="300" height="76" />
  <rect class="slot after" x="450" y="548" width="300" height="76" />
  <rect class="slot after" x="795" y="548" width="300" height="76" />
  <text x="255" y="594" text-anchor="middle" font-size="17">slot 0 · alpha · RID (10, 1)</text>
  <text x="600" y="594" text-anchor="middle" font-size="17">slot 1 · charlie · RID (30, 3)</text>
  <text x="945" y="594" text-anchor="middle" font-size="17">slot 2 · delta · RID (40, 4)</text>
  <text x="600" y="658" text-anchor="middle" font-size="15" fill="#475569">Deleting the final slot needs no copy; it only reduces the count.</text>
</svg>
