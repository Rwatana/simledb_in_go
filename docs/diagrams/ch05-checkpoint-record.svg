<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
  <title id="title">Chapter 5 Features 1–2: Recovery record prefixes</title>
  <desc id="description">A checkpoint record is one four-byte operation, while a start record adds a four-byte transaction ID.</desc>
  <defs><style>.title{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#1f2937}.label{font-family:Helvetica,Arial,sans-serif;font-size:18px;fill:#475569}.heading{font-family:Helvetica,Arial,sans-serif;font-size:24px;font-weight:700;fill:#1f2937}.text{font-family:Helvetica,Arial,sans-serif;font-size:20px;fill:#1f2937}.byte{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:24px;font-weight:700;fill:#1f2937}</style></defs>
  <rect width="1200" height="850" fill="#ffffff"/>
  <text class="title" x="600" y="70" text-anchor="middle">Chapter 5 / Features 1–2: Recovery record prefixes</text>
  <text class="label" x="275" y="195">offset 0</text><text class="label" x="925" y="195" text-anchor="end">offset 4</text>
  <rect x="275" y="215" width="650" height="205" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="3"/>
  <text class="heading" x="600" y="275" text-anchor="middle">CHECKPOINT operation code</text>
  <text class="text" x="600" y="335" text-anchor="middle">int32 = 0</text><text class="text" x="600" y="375" text-anchor="middle">big-endian</text>
  <g fill="#e1d5e7" stroke="#9673a6" stroke-width="2"><rect x="275" y="470" width="162.5" height="80"/><rect x="437.5" y="470" width="162.5" height="80"/><rect x="600" y="470" width="162.5" height="80"/><rect x="762.5" y="470" width="162.5" height="80"/></g>
  <text class="byte" x="356" y="520" text-anchor="middle">00</text><text class="byte" x="519" y="520" text-anchor="middle">00</text><text class="byte" x="681" y="520" text-anchor="middle">00</text><text class="byte" x="844" y="520" text-anchor="middle">00</text>
  <rect x="275" y="590" width="325" height="120" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="3"/><rect x="600" y="590" width="325" height="120" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="3"/>
  <text class="heading" x="437" y="635" text-anchor="middle">START operation code</text><text class="text" x="437" y="680" text-anchor="middle">int32 = 1</text>
  <text class="heading" x="762" y="635" text-anchor="middle">Transaction ID</text><text class="text" x="762" y="680" text-anchor="middle">int32 bit pattern</text>
  <rect x="275" y="760" width="650" height="65" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text class="heading" x="600" y="801" text-anchor="middle">CHECKPOINT = 4 bytes · START = 8 bytes · big-endian</text>
</svg>
