<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Chapter 11: Dispatch parsed SQL update commands</title>
  <desc id="description">The application sends a SQL update and an active transaction. ParseUpdateCommand creates typed command data, and Managers.ExecuteUpdate routes INSERT, DELETE, UPDATE, CREATE TABLE, CREATE VIEW, or CREATE INDEX to the matching UpdatePlanner operation. The result is an affected-row count or error, while the caller remains responsible for transaction completion.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2937}.label{font:700 16px system-ui,sans-serif;fill:#111827}.small{font:13px system-ui,sans-serif;fill:#374151}.box{stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text class="title" x="600" y="48" text-anchor="middle">Chapter 11 / Dispatch parsed SQL update commands</text>
  <rect class="box" x="30" y="210" width="210" height="100" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="135" y="247" text-anchor="middle">Application caller</text>
  <text class="small" x="135" y="277" text-anchor="middle">SQL update + transaction</text>
  <rect class="box" x="320" y="210" width="230" height="100" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="435" y="247" text-anchor="middle">Parser.ParseUpdateCommand</text>
  <text class="small" x="435" y="277" text-anchor="middle">SQL → typed command data</text>
  <rect class="box" x="620" y="210" width="230" height="100" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="735" y="247" text-anchor="middle">Managers.ExecuteUpdate</text>
  <text class="small" x="735" y="277" text-anchor="middle">dispatch by command type</text>
  <rect class="box" x="930" y="165" width="240" height="140" rx="14" fill="#fce7f3" stroke="#db2777"/>
  <text class="label" x="1050" y="200" text-anchor="middle">UpdatePlanner</text>
  <text class="small" x="1050" y="231" text-anchor="middle">INSERT · DELETE · UPDATE</text>
  <text class="small" x="1050" y="258" text-anchor="middle">CREATE TABLE · VIEW · INDEX</text>
  <rect class="box" x="930" y="390" width="240" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="1050" y="426" text-anchor="middle">Affected rows or error</text>
  <text class="small" x="1050" y="455" text-anchor="middle">transaction remains caller-owned</text>
  <path class="line" d="M240 260 H320"/>
  <text class="small" x="280" y="245" text-anchor="middle">statement</text>
  <path class="line" d="M550 260 H620"/>
  <text class="small" x="585" y="245" text-anchor="middle">command</text>
  <path d="M135 210 V145 H1050 V165" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text class="small" x="590" y="137" text-anchor="middle">same caller-owned transaction</text>
  <path class="line" d="M850 260 H930"/>
  <text class="small" x="890" y="245" text-anchor="middle">matching operation</text>
  <path class="line" d="M1050 305 V390"/>
  <text class="small" x="1050" y="354" text-anchor="middle">rows or error</text>
  <text class="small" x="600" y="555" text-anchor="middle">Parsing and dispatch errors return to the caller; commit or rollback remains explicit.</text>
</svg>
